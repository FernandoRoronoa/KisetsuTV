as tantos años de ermitaño le esperan un mundo nuevo y aventuras frescas. Quizá eche una mano a Pochi para ganar el misterioso torneo de familiares, o quizá pierda hasta el último resto de dignidad y salga corriendo. Lo que llegue antes. En cualquier caso, Asley tiene un gran mal que combatir, un mundo enorme que salvar e incluso algo de madurar, siempre que aguante por el camino los «consejos de amigo» de Pochi. (Fuente: J-Novel Club)","183692":"Precuela de la película Mobile Suit Gundam SEED FREEDOM. Tras el hundimiento del Plan Destiny propuesto por Dullindal, que habría decidido el destino de cada persona según su genética, Cagalli, representante principal de la Unión de Emiratos de Orb, trabaja para instaurar un nuevo orden pacífico mediante una agencia mundial de vigilancia de la paz llamada COMPASS. Año 74 de la Era Cósmica. La gran guerra ha terminado, pero Shinn aún no sabe qué camino seguir. Entonces un mobile suit superviviente de muchas batallas es trasladado de ZAFT a la base provisional de COMPASS en la isla de Onogoro. Esa misma noche, sin embargo, alguien roba el Strike Freedom Gundam. Para evitar que la situación se desborde, recuperar la máquina robada y proteger todo lo que les importa, Shinn y sus compañeros vuelven a lanzarse al combate. (Fuente: web oficial de Mobile Suit Gundam SEED FREEDOM)","214969":"El cuento de Caperucita Roja es de los más clásicos que hay: una entrega de galletas y vino de toda la vida. Pero en este viaje en concreto, Caperucita se topa con un cadáver. A medida que se desenreda el misterio, caras conocidas de otros cuentos como Cenicienta, Hansel y Gretel o La bella durmiente aportan sus propios giros y trampas. ¿Conseguirá resolver el enigma mayor que hay en el centro de todo? ¡Ha nacido una nueva detective!","211496":"El joven Chihiro pasa los días entrenando con su padre, un famoso forjador de espadas, con la esperanza de llegar a ser un gran espadero. El padre payaso y el hijo serio pensaban que esos días durarían para siempre. Pero de pronto llega la tragedia: un día oscuro empapado en sangre. Ahora Chihiro y su espada viven solo para la venganza. (Fuente: MANGA Plus)","185657":"Segunda temporada de Skip to Loafer.","200927":"Segundo cour de la tercera temporada de Kusuriya no Hitorigoto.","209247":"Tercera temporada de Boku no Kokoro no Yabai Yatsu.","211495":"Segunda temporada de Boushoku no Berserk. La habilidad Gula. En un mundo donde las habilidades mágicas marcan tu destino, Fate ha despertado un poder sin igual: devorar las habilidades y estadísticas de quienes mata. Tras sobrevivir a incontables batallas mortales junto a Greed, su espada negra y compañera de confianza, Fate regresa por fin a la capital. Él, que antes era un desheredado al que todos despreciaban, nunca ha olvidado lo que es vivir en lo más bajo. Ahora da un paso adelante como Caballero Sagrado, pero le espera una batalla aún mayor, una que lo acercará a la verdad que se esconde tras su mundo. El destino de Fate vuelve a ponerse en marcha. (Fuente: Crunchyroll)","184072":"Cuarta temporada de Yuru Camp△.","199597":"Bienvenidos a Kindergarten Noir, una guardería exclusiva para los hijos de la élite mundial. Rita, una de las maestras, lleva tiempo buscando novio sin ningún éxito. Un día, un asesino va a por uno de los niños… ¿y resulta que está buenísimo? Métete en esta comedia romántica llena de acción que transcurre en la guardería «más segura» del mundo. (Fuente: MANGA PLUS)","211304":"Momose siempre ha soñado con un instituto tranquilo: no quiere saber nada de matones, delincuentes ni buscapleitos. Cuando conoce a Ichikura, un chico discreto de pelo negro y gafas, le parece un buen tipo de lo más normal. Pero resulta que en secundaria fue un delincuente temible. Él insiste en que ha cambiado, aunque sigue teniendo un don para meterse en peleas. ¿De verdad ha pasado página Ichikura? ¿Y guardará Momose el secreto de su pasado conflictivo? (Fuente: Seven Seas Entertainment)","199152":"Película completamente nueva de GIRLS BAND CRY.","213655":"Un mundo roto en un futuro no muy lejano. La humanidad se enfrenta a un fenómeno nuevo: «Nos atacan humanos que deberían estar muertos». El gobierno decide encargar el caso a un organismo especializado: el Laboratorio de Óptica y Análisis Neuronal, conocido como LONA. La investigadora Ao y su aprendiz Sango intentarán llegar al fondo del misterio analizando los cerebros de los muertos. ¿En qué piensan las personas y qué dejan atrás antes de morir? Incontables recuerdos grabados en los circuitos neuronales. ¿Qué vieron en esas profundidades? (Fuente: web oficial de LONA)","210945":"Nada en este mundo es más peligroso que una bruja. Encarnación del miedo y del terror, pueden provocar inundaciones por capricho, invocar bolas de fuego de la nada o arrasar países enteros en una noche. Si despiertas su ira, nadie está a salvo. Al menos eso es lo que todos creen, y por eso todos quieren ver muerta a Siasha. Tras otra batalla violenta por su vida, se alía con Zig, un mercenario, y ambos parten hacia tierras desconocidas en busca de un lugar donde ella pueda vivir en paz. Pero ¿estarán a la altura de la magia perdida y de las criaturas atroces que les esperan? (Fuente: Seven Seas Entertainment)","98476":"Biblia Koshodou no Jiken Techou es una serie de misterio en la que Shioriko Shinokawa, la joven dueña de una librería de viejo en Kamakura, desentraña los enigmas que esconden los libros antiguos que llegan a su tienda. La historia empieza cuando Daisuke, un joven que creció prácticamente sin leer por una fobia, lleva a esa librería misteriosa las obras completas y firmadas de Natsume Soseki, el escritor japonés de la era Meiji, heredadas de su abuela. ¿Resolverá la tímida e introvertida Shioriko el misterio de esos libros?","187918":"En secundaria, Shun era un futbolista conocido, pero una lesión lo dejó fuera y le impidió no solo jugar, sino hacer cualquier actividad física. Al entrar en el instituto se cansó de rechazar invitaciones de un club tras otro. Harto, un día dijo en voz alta que lo único que quería era irse a casa. Al oírlo, una chica llamada Naoki lo invitó a unirse al «Club de Irse a Casa a Tope». Así acabaron volviendo juntos a casa poco a poco, y con ello arranca la comedia romántica. (Fuente: Natalie, traducido)","195787":"La serie sigue a Chrono, un chico de 14 años que pertenece a la unidad especial de la Policía del Espacio-Tiempo conocida como los Rewinders. La organización usa su «Ojo de Reintento» para salvar a personas que ya han muerto, aprovechando el conocimiento del futuro para retroceder en el tiempo una y otra vez hasta alcanzar un futuro en el que la víctima siga viva. (Fuente: Crunchyroll News, editado)","217330":"Rimuru mató al rey demonio Clayman en el Walpurgis. Pero, al borde de la muerte, Clayman obtuvo la habilidad única «Regresor» y despertó en su habitación setenta años atrás. Por todo lo que ve, aquello es real. Clayman empieza entonces a buscar la forma de no repetir sus errores del pasado, aunque… ¿logrará esquivar su futuro condenado aprovechando el bucle?","207692":"Los días de lluvia, Hina sueña con ella misma de pequeña jugando con un niño misterioso en un jardín que no ha visto nunca, hasta que da con ese lugar por casualidad. Allí hay un joven, Takaaki, que la confunde con su prometida Hinako y se la lleva a la que cree que es su casa, donde la espera su propia doble. Hina comprende entonces que no está en el Tokio que dejó atrás, sino en el Japón de 1907. ¿Es todo un sueño o algo mucho más extraño? (Fuente: Kodansha USA)","217457":"Hizashi Hiruno, recién entrado en un instituto superexclusivo, acaba de hacer el primer examen de nivel del curso. Espera los resultados con nervios, porque marcarán el tono de sus próximos tres años. Pero, por un error al rellenar la hoja de respuestas, saca una nota pésima y lo mandan a clases de recuperación. Lo único bueno es que no es el único… y su compañera de castigo podría ser la chica de sus sueños. (Fuente: Yen Press)","219243":"Segunda parte de Romelia Senki: Maou wo Taoshita nochi mo Jinrui Yabasou dakara Guntai Soshiki Shita.","216312":"Cuando Sora Akizuki le confiesa sus sentimientos a Miya Fuwa, ella lo rechaza de plano: resulta que le gusta Asahi Suzukaze, la presidenta del misterioso Club de Ensayos Clínicos. Al entrar en el club para saber más de Asahi, descubre que ella también está enamorada de otra persona. ¿Puede complicarse más esta cadena de amores no correspondidos? (Fuente: Yen Press)","193296":"Esta no es la historia que conocemos. Corre el año 1600 y han pasado diez años desde que Oda Nobunaga unificó todo Japón. Al sentir que se acerca su final, Nobunaga anuncia que entregará las riendas del poder a quien le traiga al guerrero más fuerte. Los generales, con sus sueños de conquista truncados, presentan a sus mejores luchadores con la mira puesta en convertirse en reyes del país. (Fuente: Kodansha USA)","218439":"Cuando Kanako echa por error el currículum en una agencia de asesinos, esta oficinista tímida descubre que se le da de maravilla quitar gente de en medio. ¿Se ganará alguna vez el respeto de Sakurai, su compañero borde y un poco atractivo? ¿Y por qué sigue teniendo los típicos problemas de oficina si trabaja entre sicarios? Un manga a todo color peligrosamente divertido. (Fuente: Seven Seas Entertainment)","179088":"Quinta temporada de Minami-ke, anunciada durante el evento Mixa Animation Diary por el 20.º aniversario de la serie.","187361":"Ambientada en New Dawn, una metrópolis futurista, Free Fire Daybreak sigue a Kelly, que despierta sin recuerdos de su pasado y acaba envuelta en el misterioso «Proyecto Bloom» de la corporación Horizon. (Fuente: web oficial)","141922":"Douzen, un sacerdote taoísta que recorre el país, se encuentra un día con una niña criada por un yokai. Ajena a las emociones y al afecto humanos, Douzen le pone el nombre de Shouzen y decide llevarla consigo en sus viajes como discípula. ¿Qué es la bondad? ¿Qué es el amor? Así empieza el camino espiritual de Shouzen mientras se convierte en un ser humano. (Fuente: Fuji TV, traducido)","220167":"Detectives que usan la fuerza para resolver crímenes violentos: los llamados «butei». Kinji Toyama y Aria H. Kanzaki han resuelto casos por todo el mundo. A su vuelta a Japón se encuentran con un incidente de drones y robots descontrolados en la isla Gakuen. Para resolverlo se les unen Shirayuki, Riko y Reki, de Baskerville, además de Lisa, la criada de Kinji, Minuet, la hermana pequeña de Aria y detective excepcional, e incluso Nemo, que en su día fue un enemigo temible. Con tiroteos y enredos amorosos a partes iguales, empieza la nueva historia de los butei. (Fuente: web oficial, traducido)","216623":"Cuadragésima sexta película de Doraemon.","217331":"Tercera parte de la cuarta temporada de Tensei Shitara Slime Datta Ken. Nota: al tratarse del tercer cour de la temporada, se denomina «Part 3».","186057":"Huérfana tras el ataque de un monstruo a su aldea, la pequeña Alicia pasa tres años horribles en un orfanato antes de escaparse. Durante la huida se topa con una mujer mayor empeñada en matarla y, en el forcejeo, entra en contacto con un cristal extraño que le otorga un enorme caudal de conocimiento y la transforma de niña inocente en una estratega fría y calculadora. Al descubrir que estaba destinada a ser la protagonista de un otome game, y asqueada por ese supuesto destino, Alicia decide tomar las riendas y hacerse fuerte por los medios que haga falta. Con ese conocimiento nuevo, y con la ayuda de un desconocido al que conoce en el bosque, aprende a sobrevivir sola en un mundo demasiado duro para una niña de su edad. Esté lista o no, piensa abrirse su propio camino. (Fuente: J-Novel Club)","218216":"Yajima ve espíritus desde pequeño. En su nuevo colegio hay una sala que nadie más puede ver, y dentro vive un espíritu al que le encantan los videojuegos. ¡Empieza una nueva saga de exorcistas modernos! (Fuente: Manga Plus)","219265":"Piso amplio en un edificio nuevo, cocina enorme con vitrocerámica de inducción, baño con el inodoro aparte e incluso lavadero, todo por… ¿4.800 yenes al mes? Hay un motivo escalofriante por el que la Residencia Shiba sale tan barata. La habitación que le ofrecen al estudiante de instituto Kori Momose viene con compañero incluido: Mu-chan, un shiba inu que resulta ser un espíritu atado a la tierra. Con el objetivo último de vivir cómodo y sin compañeros, Kori prueba todo tipo de estrategias para desligar a Mu de la habitación 101. Prepárate para una comedia entrañable en la Residencia Shiba, llena de vecinos peculiares, shiba inus adorables y mucho caos peludo. (Fuente: web oficial de SHIBA INU ROOMS)","209939":"Tercera temporada de Sousou no Frieren.","178031":"Segunda temporada de Dungeon Meshi.","104328":"Ante la amenaza del Estado de Qin, el peligro parece acechar dentro del propio Estado de Han, considerado el más débil de los Siete Estados. Lo que el emperador de Han ignora es que esa amenaza es su gran general, Ji Wuye, bajo cuyo mando operan los Cuatro Guerreros del Anochecer, especializados en milicia, finanzas, política y espionaje. Con la esperanza de crear un Han nuevo, Han Fei, noveno príncipe del reino, funda Arenas Movedizas. Junto a Wei Zhuang, Zhang Liang, Zinü y Nong Yu, apoyan al príncipe en su objetivo mientras son arrastrados a un torbellino de poder llamado «mundo». (Fuente: Wikipedia)","215969":"TENCHI GALAXY sigue a la pandilla de Tenchi en su viaje a MIKUNI, el planeta de los piratas espaciales, en busca de un artefacto robado a Jurai. Para recuperarlo tendrán que enfrentarse a NIIMI, la reina de los piratas. ¿Qué peligros les esperan? ¿Qué relación hay entre Niimi y Ryouko? ¿Y de qué lado está Nagi? (Fuente: Kickstarter oficial). Nota: las relaciones entre obras son provisionales y pueden cambiar."}</script>
<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const safeUrl = u => (typeof u === "string" && u.startsWith("https://")) ? u : null;

/* ---------- sinopsis en español (botón de traducción) ---------- */
let TRAD_ES = {};
try { TRAD_ES = JSON.parse(document.getElementById("trad-es").textContent) || {}; } catch (e) { TRAD_ES = {}; }

/* ---------- diccionarios ---------- */
const FMT = {TV:"Serie TV", TV_SHORT:"Corto TV", MOVIE:"Película", OVA:"OVA", ONA:"ONA", SPECIAL:"Especial", MUSIC:"Vídeo musical"};
const EST = {NOT_YET_RELEASED:"Por estrenar", RELEASING:"En emisión", FINISHED:"Finalizado", CANCELLED:"Cancelado", HIATUS:"En pausa"};
const SRC = {MANGA:"Manga", ORIGINAL:"Obra original", LIGHT_NOVEL:"Novela ligera", VISUAL_NOVEL:"Novela visual", VIDEO_GAME:"Videojuego",
  NOVEL:"Novela", WEB_NOVEL:"Novela web", DOUJINSHI:"Doujinshi", ANIME:"Anime", GAME:"Juego", COMIC:"Cómic",
  MULTIMEDIA_PROJECT:"Proyecto multimedia", PICTURE_BOOK:"Libro ilustrado", LIVE_ACTION:"Acción real", OTHER:"Otra fuente"};
const GEN = {Action:"Acción", Adventure:"Aventura", Comedy:"Comedia", Drama:"Drama", Ecchi:"Ecchi", Fantasy:"Fantasía", Horror:"Terror",
  "Mahou Shoujo":"Mahou shoujo", Mecha:"Mecha", Music:"Música", Mystery:"Misterio", Psychological:"Psicológico", Romance:"Romance",
  "Sci-Fi":"Ciencia ficción", "Slice of Life":"Recuentos de la vida", Sports:"Deportes", Supernatural:"Sobrenatural", Thriller:"Suspense"};
const PAIS = {JP:"Japón", CN:"China", KR:"Corea del Sur", TW:"Taiwán"};
const MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DIAS_C = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const PLAT_COLOR = {Crunchyroll:"#f47521", Netflix:"#e50914", "Amazon Prime Video":"#00a8e1", "Disney Plus":"#0e2a6e", HIDIVE:"#00bfa5",
  Hulu:"#1ce783", Max:"#5c2ed6", "Bilibili TV":"#00a1d6", YouTube:"#ff0033", "Muse Asia":"#a855f7", AnimeLab:"#ff7f00", Netflix_JP:"#e50914"};
const platColor = s => PLAT_COLOR[s] || "#6b6480";

/* ---------- estado ---------- */
const S = {data:null, season:0, view:"grid", q:"", fmt:new Set(), plat:new Set(), genre:"", sort:"pop", soloFav:false, soloFecha:false, favs:new Set()};
try { const raw = localStorage.getItem("anitemp.favs"); if (raw) S.favs = new Set(JSON.parse(raw)); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem("anitemp.favs", JSON.stringify([...S.favs])); } catch (e) {} };

/* ---------- utilidades ---------- */
const fechaLarga = d => (d && d.y && d.m) ? `${d.d ? d.d + " de " : ""}${MES[d.m - 1]} de ${d.y}` : null;
const fechaCorta = d => (d && d.m && d.d) ? `${d.d} ${MES[d.m - 1].slice(0, 3)}` : (d && d.y ? String(d.y) : null);

function cuando(a) {
  // Devuelve {ts:Date|null, dia:0-6|null, hora:string|null, exacta:boolean}
  if (a.siguiente && a.siguiente.ts) {
    const t = new Date(a.siguiente.ts * 1000);
    return {ts:t, dia:t.getDay(), hora:t.toLocaleTimeString("es", {hour:"2-digit", minute:"2-digit"}), exacta:true, ep:a.siguiente.ep};
  }
  const d = a.estreno;
  if (d && d.y && d.m && d.d) {
    const t = new Date(d.y, d.m - 1, d.d, 12, 0, 0);
    return {ts:t, dia:t.getDay(), hora:null, exacta:false, ep:1};
  }
  return {ts:null, dia:null, hora:null, exacta:false, ep:null};
}

function restante(ts) {
  let s = Math.floor((ts.getTime() - Date.now()) / 1000);
  if (s < 0) return null;
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  return {d, h, m, s};
}
const corto = r => r.d > 0 ? `${r.d}d ${r.h}h ${String(r.m).padStart(2,"0")}m` : `${r.h}h ${String(r.m).padStart(2,"0")}m ${String(r.s).padStart(2,"0")}s`;

function estadoTexto(a) {
  const c = cuando(a);
  if (a.estado === "FINISHED") return {cls:"is-done", txt:"Finalizado", dot:false};
  if (a.estado === "CANCELLED") return {cls:"is-done", txt:"Cancelado", dot:false};
  if (c.ts) {
    const r = restante(c.ts);
    if (r) {
      const pre = a.estado === "RELEASING" ? `Ep. ${c.ep} en ` : "Estreno en ";
      return {cls:a.estado === "RELEASING" ? "is-live" : "is-soon", txt:pre + corto(r), dot:true, ts:c.ts, ep:c.ep, live:a.estado === "RELEASING"};
    }
    if (a.estado === "RELEASING") return {cls:"is-live", txt:"En emisión", dot:true};
    return {cls:"is-soon", txt:"Estrenado " + (fechaCorta(a.estreno) || ""), dot:false};
  }
  const f = fechaCorta(a.estreno);
  return f ? {cls:"is-soon", txt:"Estreno " + f, dot:false} : {cls:"is-tbd", txt:"Fecha por confirmar", dot:false};
}

const titulo = a => a.titulo || a.tituloEn || "Sin título";
const generosEs = a => (a.generos || []).map(g => GEN[g] || g);

/* ---------- filtrado ---------- */
function visibles() {
  const t = S.data.temporadas[S.season];
  let arr = t.animes.slice();
  if (S.q) {
    const q = S.q.toLowerCase();
    arr = arr.filter(a => [titulo(a), a.tituloEn, a.tituloJp, (a.estudios || []).join(" "), (a.streams || []).map(s => s.site).join(" "), generosEs(a).join(" ")]
      .filter(Boolean).join(" ").toLowerCase().includes(q));
  }
  if (S.fmt.size) arr = arr.filter(a => S.fmt.has(a.formato || "OTRO"));
  if (S.plat.size) arr = arr.filter(a => (a.streams || []).some(s => S.plat.has(s.site)));
  if (S.genre) arr = arr.filter(a => (a.generos || []).includes(S.genre));
  if (S.soloFav) arr = arr.filter(a => S.favs.has(a.id));
  if (S.soloFecha) arr = arr.filter(a => a.estreno && a.estreno.y && a.estreno.m && a.estreno.d);
  const key = {
    pop: (x, y) => (y.popularidad || 0) - (x.popularidad || 0),
    score: (x, y) => (y.puntuacion || 0) - (x.puntuacion || 0),
    titulo: (x, y) => titulo(x).localeCompare(titulo(y), "es"),
    fecha: (x, y) => {
      const n = a => { const d = a.estreno; return d && d.y ? d.y * 10000 + (d.m || 12) * 100 + (d.d || 28) : 99999999; };
      return n(x) - n(y);
    }
  }[S.sort];
  return arr.sort(key);
}

/* ---------- piezas de UI ---------- */
function platPills(a, max) {
  const box = el("div", "plats");
  const list = (a.streams || []).slice(0, max);
  if (!list.length) { box.appendChild(el("span", "plat-none", "Plataforma por anunciar")); return box; }
  list.forEach(s => {
    const u = safeUrl(s.url);
    const n = u ? el("a", "plat-pill") : el("span", "plat-pill");
    n.textContent = s.site;
    n.style.setProperty("--c", s.color || platColor(s.site));
    if (u) { n.href = u; n.target = "_blank"; n.rel = "noopener"; n.addEventListener("click", e => e.stopPropagation()); }
    box.appendChild(n);
  });
  if ((a.streams || []).length > max) box.appendChild(el("span", "plat-none", "+" + ((a.streams).length - max)));
  return box;
}

function favBtn(a) {
  const b = el("button", "fav");
  b.setAttribute("aria-pressed", S.favs.has(a.id) ? "true" : "false");
  b.setAttribute("aria-label", "Guardar en mi lista");
  b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.6 9.7l5.8-.8z"/></svg>';
  b.addEventListener("click", e => {
    e.stopPropagation();
    if (S.favs.has(a.id)) { S.favs.delete(a.id); toast("Quitado de tu lista"); } else { S.favs.add(a.id); toast("Guardado en tu lista ★"); }
    saveFavs(); b.setAttribute("aria-pressed", S.favs.has(a.id) ? "true" : "false");
    if (S.soloFav) render();
  });
  return b;
}

function imgFor(a, cls) {
  if (!a.portada) { const d = el("div", "noimg", titulo(a)); return d; }
  const i = el("img", cls || null);
  i.src = a.portada; i.alt = "Póster de " + titulo(a); i.loading = "lazy"; i.decoding = "async";
  return i;
}

function card(a, i) {
  const c = el("article", "card");
  c.style.setProperty("--i", i); if (a.color) c.style.setProperty("--c", a.color);
  const p = el("button", "poster");
  p.setAttribute("aria-label", "Ver ficha de " + titulo(a));
  p.appendChild(imgFor(a));
  p.appendChild(el("span", "shade"));
  p.appendChild(el("span", "tag", FMT[a.formato] || "Anime"));
  if (a.puntuacion) p.appendChild(el("span", "score", a.puntuacion + "%"));
  p.addEventListener("click", () => abrir(a));
  c.appendChild(p);
  c.appendChild(favBtn(a));
  const b = el("div", "body");
  b.appendChild(el("h3", "t", titulo(a)));
  b.appendChild(el("p", "studio", (a.estudios || []).join(" · ") || "Estudio por confirmar"));

function calendario(arr, out) {
  const hoy = new Date().getDay();
  const orden = [1, 2, 3, 4, 5, 6, 0];
  const cubos = new Map(orden.map(d => [d, []]));
  const sin = [];
  arr.forEach(a => { const c = cuando(a); if (c.dia == null) sin.push(a); else cubos.get(c.dia).push([a, c]); });
  const cal = el("div", "cal");
  orden.forEach((d, idx) => {
    const col = el("div", "day" + (d === hoy ? " today" : ""));
    col.style.setProperty("--i", idx);
    const items = cubos.get(d).sort((x, y) => (x[1].ts - y[1].ts));
    const h = el("h3", null, DIAS[d]);
    h.appendChild(el("em", null, items.length + (items.length === 1 ? " serie" : " series")));
    col.appendChild(h);
    if (!items.length) col.appendChild(el("div", "none", "Nada por ahora"));
    else {
      const ul = el("ul");
      items.forEach(([a, c]) => {
        const li = el("li");
        li.tabIndex = 0; li.setAttribute("role", "button");
        li.appendChild(imgFor(a));
        const t = el("div");
        t.appendChild(el("div", "lt", titulo(a)));
        t.appendChild(el("div", "lh", c.exacta ? (c.hora + " · ep. " + c.ep) : ("Estreno " + (fechaCorta(a.estreno) || "s/f"))));
        li.appendChild(t);
        const go = () => abrir(a);
        li.addEventListener("click", go);
        li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
        ul.appendChild(li);
      });
      col.appendChild(ul);
    }
    cal.appendChild(col);
  });
  if (sin.length) {
    const col = el("div", "day full"); col.style.setProperty("--i", 7);
    const h = el("h3", null, "Sin fecha");
    h.appendChild(el("em", null, sin.length + " series"));
    col.appendChild(h);
    const ul = el("ul");
    sin.forEach(a => {
      const li = el("li"); li.tabIndex = 0; li.setAttribute("role", "button");
      li.appendChild(imgFor(a));
      const t = el("div");
      t.appendChild(el("div", "lt", titulo(a)));
      t.appendChild(el("div", "lh", "Por confirmar"));
      li.appendChild(t);
      li.addEventListener("click", () => abrir(a));
      li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(a); } });
      ul.appendChild(li);
    });
    col.appendChild(ul);
    cal.appendChild(col);
  }
  out.appendChild(cal);
}

function haceCuanto(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  const h = Math.floor(ms / 3600000);
  if (h < 1) return "hace minutos";
  if (h < 24) return `hace ${h} h`;
  const d = Math.floor(h / 24);
  return d === 1 ? "ayer" : `hace ${d} días`;
}

/* ---------- datos en vivo desde AniList ---------- */
const API = "https://graphql.anilist.co";
const TTL = 5 * 60 * 60 * 1000;            // 5 horas
const CACHE = "kisetsu.cache.v1";
const ES_SEASON = {WINTER:"Invierno", SPRING:"Primavera", SUMMER:"Verano", FALL:"Otoño"};

function temporadasObjetivo(n) {
  const orden = ["WINTER", "SPRING", "SUMMER", "FALL"];
  const hoy = new Date(); let y = hoy.getFullYear(); const m = hoy.getMonth() + 1; let i;
  if (m === 12) { i = 0; y++; } else if (m <= 2) i = 0; else if (m <= 5) i = 1; else if (m <= 8) i = 2; else i = 3;
  const out = [];
  for (let k = 0; k < n; k++) { const j = i + k; out.push({season: orden[j % 4], year: y + Math.floor(j / 4)}); }
  return out;
}

const CAMPOS = `id title{romaji english native} description(asHtml:false) format status episodes duration
  startDate{year month day} genres averageScore popularity countryOfOrigin source siteUrl
  coverImage{large color} trailer{id site} studios{edges{isMain node{name}}}
  nextAiringEpisode{airingAt episode} airingSchedule(notYetAired:true, perPage:1){nodes{airingAt episode}}
  externalLinks{site url type language color}`;

async function consulta(temps, page, perPage) {
  const q = "query{" + temps.map((t, i) =>
    `s${i}: Page(page:${page}, perPage:${perPage}){media(season:${t.season}, seasonYear:${t.year}, type:ANIME, sort:POPULARITY_DESC, isAdult:false){${CAMPOS}}}`
  ).join(" ") + "}";
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json", "Accept":"application/json"}, body:JSON.stringify({query:q})});
  if (!r.ok) throw new Error("AniList respondió " + r.status);
  const j = await r.json();
  if (!j.data) throw new Error((j.errors && j.errors[0] && j.errors[0].message) || "respuesta vacía de AniList");
  return j.data;
}

const ORDEN_PLAT = ["Crunchyroll","Netflix","Amazon Prime Video","Disney Plus","HIDIVE","Hulu","Max","Bilibili TV","YouTube","Muse Asia"];
function limpia(t) {
  if (!t) return "";
  return t.replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "")
    .replace(/&quot;/g, '"').replace(/&#039;/g, "'").replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/\s+/g, " ").trim();
}
function mapea(m) {
  const eds = (m.studios && m.studios.edges) || [];
  const streams = (m.externalLinks || [])
    .filter(l => l.type === "STREAMING" && typeof l.url === "string" && l.url.startsWith("https://"))
    .map(l => ({site:l.site, url:l.url, color:l.color, lang:l.language}))
    .sort((a, b) => {
      const ia = ORDEN_PLAT.indexOf(a.site), ib = ORDEN_PLAT.indexOf(b.site);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.site.localeCompare(b.site);
    });
  const info = (m.externalLinks || []).find(l => l.type === "INFO" && l.site === "Official Site" && typeof l.url === "string" && l.url.startsWith("https://"));
  const prog = m.nextAiringEpisode || ((m.airingSchedule && m.airingSchedule.nodes && m.airingSchedule.nodes[0]) || null);
  const d = m.startDate || {};
  return {
    id: m.id,
    titulo: (m.title && (m.title.romaji || m.title.english)) || "Sin título",
    tituloEn: m.title && m.title.english,
    tituloJp: m.title && m.title.native,
    sinopsis: limpia(m.description),
    formato: m.format, estado: m.status, episodios: m.episodes, duracion: m.duration,
    estreno: {y: d.year, m: d.month, d: d.day},
    generos: m.genres || [],
    puntuacion: m.averageScore, popularidad: m.popularity,
    pais: m.countryOfOrigin, fuente: m.source,
    estudios: eds.filter(e => e.isMain).map(e => e.node.name),
    productoras: eds.filter(e => !e.isMain).map(e => e.node.name).slice(0, 4),
    streams,
    siteUrl: m.siteUrl,
    oficial: info ? info.url : null,
    trailer: (m.trailer && m.trailer.site === "youtube" && m.trailer.id) ? "https://www.youtube.com/watch?v=" + m.trailer.id : null,
    color: m.coverImage && m.coverImage.color,
    siguiente: prog ? {ts: prog.airingAt, ep: prog.episode} : null,
    portada: (m.coverImage && m.coverImage.large) || null
  };
}

async function descargar() {
  const temps = temporadasObjetivo(8);
  const lotes = [
    consulta(temps.slice(0, 4), 1, 50),
    consulta(temps.slice(4, 8), 1, 50),
    consulta(temps.slice(0, 3), 6, 10)   // títulos 51-60 de las temporadas grandes
  ];
  const [a, b, c] = await Promise.all(lotes);
  const temporadas = [];
  temps.forEach((t, i) => {
    const base = i < 4 ? (a["s" + i] || {}) : (b["s" + (i - 4)] || {});
    const extra = i < 3 ? (c["s" + i] || {}) : {};
    const vistos = new Set();
    const animes = [].concat(base.media || [], extra.media || [])
      .filter(m => !vistos.has(m.id) && vistos.add(m.id))
      .map(mapea);
    if (!animes.length) return;                      // temporada sin anuncios todavía
    temporadas.push({
      clave: t.season.toLowerCase() + "-" + t.year,
      season: t.season, year: t.year,
      nombre: ES_SEASON[t.season] + " " + t.year,
      animes
    });
  });
  if (!temporadas.length) throw new Error("AniList no devolvió temporadas");
  return {generado: new Date().toISOString(), fuente: "AniList", temporadas};
}

function leerCache() {
  try {
    const raw = localStorage.getItem(CACHE);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || !o.datos || !o.datos.temporadas) return null;
    return o;
  } catch (e) { return null; }
}
function guardarCache(datos) {
  try { localStorage.setItem(CACHE, JSON.stringify({ts: Date.now(), datos})); } catch (e) {}
}

function pintarTodo(mantenerTemporada) {
  const antes = mantenerTemporada && S.data.temporadas[S.season] ? S.data.temporadas[S.season].clave : null;
  if (antes) {
    const i = S.data.temporadas.findIndex(t => t.clave === antes);
    S.season = i >= 0 ? i : 0;
  }
  pintarTemporadas(); pintarCabecera(); pintarFiltros(); render(); pintarSello();
}

function pintarSello(aviso) {
  const u = $("#upd"); u.innerHTML = "";
  u.appendChild(el("span", "pulse"));
  u.append(document.createTextNode(aviso || ("Datos de hace " + haceCuanto(S.data.generado).replace(/^hace /, "") + " · se actualizan solos cada 5 h")));
}

let cargando = false;
async function refrescar(manual) {
  if (cargando) return;
  cargando = true;
  const btn = $("#recargar");
  if (btn) { btn.disabled = true; btn.textContent = "Actualizando…"; }
  try {
    const datos = await descargar();
    S.data = datos; guardarCache(datos);
    pintarTodo(true);
    if (manual) toast("Datos actualizados");
  } catch (e) {
    if (manual) toast("AniList no responde ahora mismo");
    if (S.data) pintarSello("Último intento falló · mostrando datos de hace " + haceCuanto(S.data.generado).replace(/^hace /, ""));
  } finally {
    cargando = false;
    if (btn) { btn.disabled = false; btn.textContent = "Actualizar ahora"; }
  }
}

(async function init() {
  esqueleto();
  const cache = leerCache();
  if (cache) {
    S.data = cache.datos;
    const h0 = location.hash.replace("#", "");
    const i0 = S.data.temporadas.findIndex(t => slug(t.nombre) === h0);
    S.season = i0 >= 0 ? i0 : 0;
    $("#out").innerHTML = "";
    pintarTodo(false);
  }
  if (!cache || (Date.now() - cache.ts) > TTL) {
    try {
      const datos = await descargar();
      S.data = datos; guardarCache(datos);
      const h = location.hash.replace("#", "");
      const i = S.data.temporadas.findIndex(t => slug(t.nombre) === h);
      if (i >= 0) S.season = i;
      $("#out").innerHTML = "";
      pintarTodo(!!cache);
    } catch (e) {
      if (!S.data) {
        $("#out").innerHTML = "";
        const b = el("div", "empty");
        b.appendChild(el("h3", null, "No se pudo contactar con AniList"));
        b.appendChild(el("p", null, "Su API no respondió. Recarga la página en un momento."));
        const r = el("button", "tr-btn", "Reintentar");
        r.addEventListener("click", () => location.reload());
        b.appendChild(r);
        $("#out").appendChild(b);
        return;
      }
      pintarSello("Mostrando datos guardados · AniList no respondió");
    }
  }
  // refresco automático cada 5 h con la pestaña abierta, y al volver a ella si ya caducó
  setInterval(() => refrescar(false), TTL);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    const c = leerCache();
    if (!c || (Date.now() - c.ts) > TTL) refrescar(false);
  });
  const btn = $("#recargar");
  if (btn) btn.addEventListener("click", () => refrescar(true));
})();
</script>
