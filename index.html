<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kisetsu TV</title>
<meta name="description" content="Guía de estrenos de anime por temporada: sinopsis, estudio, episodios, fecha de estreno y dónde verlo. Datos en vivo de AniList.">
<meta property="og:title" content="Kisetsu TV">
<meta property="og:description" content="Qué anime se estrena cada temporada y dónde verlo.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#121018">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Guía de emisión nocturna: rejilla de pósters sobre tinta, rail de filtros fijo y tres vistas (rejilla · lista · calendario). Tema único oscuro. */
:root{
  color-scheme: dark;
  --ink:#121018;          /* fondo */
  --panel:#1c1a25;        /* tarjetas y paneles */
  --panel-2:#262330;      /* relieve */
  --line:#352f44;         /* bordes */
  --text:#f3eef7;
  --muted:#a69fb6;
  --shu:#ff4b35;          /* acento vermellón */
  --amber:#ffc24b;        /* puntuación */
  --live:#48d6a0;         /* en emisión */
  --soon:#7ab8ff;         /* por estrenar */
  --display:"Anton","Arial Narrow",Impact,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --r:14px;
  --max:min(2200px,94vw);   /* ancho util: llena pantallas anchas sin estirar el texto */
  --shadow:0 18px 40px -18px #000000cc;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text); font-family:var(--body);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* aurora de fondo */
.aurora{position:fixed;inset:-20vmax;z-index:0;pointer-events:none;filter:blur(70px);opacity:.5}
.aurora i{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen;animation:drift 34s ease-in-out infinite}
.aurora i:nth-child(1){width:46vmax;height:46vmax;left:2%;top:0;background:#ff4b3533}
.aurora i:nth-child(2){width:38vmax;height:38vmax;right:4%;top:8%;background:#7a3cff2e;animation-delay:-9s}
.aurora i:nth-child(3){width:40vmax;height:40vmax;left:28%;bottom:0;background:#1f9e8a2b;animation-delay:-18s}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(6vmax,-4vmax,0) scale(1.12)}66%{transform:translate3d(-5vmax,5vmax,0) scale(.94)}}
.wrap{position:relative;z-index:1;width:var(--max);max-width:100%;margin:0 auto;padding:0 20px 90px}

/* ---------- cabecera ---------- */
header.top{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  background:#121018e6;border-bottom:1px solid var(--line);
  transition:padding .25s ease;
}
.top-in{width:var(--max);max-width:100%;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:25px;letter-spacing:.02em;line-height:1}
.brand b{color:var(--shu)}
.brand em{font-family:var(--body);font-style:normal;font-weight:700;font-size:11px;color:var(--muted);letter-spacing:.14em;margin-left:2px;align-self:center}
.brand .tv{width:30px;height:22px;border:2px solid var(--shu);border-radius:5px;position:relative;flex:0 0 auto}
.brand .tv::after{content:"";position:absolute;left:50%;top:-8px;width:2px;height:8px;background:var(--shu);transform:rotate(18deg)}
.brand .tv::before{content:"";position:absolute;left:50%;top:-8px;width:2px;height:8px;background:var(--shu);transform:rotate(-18deg)}
.search{flex:1 1 230px;min-width:180px;position:relative}
.search input{
  width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font:inherit;font-size:14px;transition:border-color .2s,box-shadow .2s
}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--shu);box-shadow:0 0 0 3px #ff4b3528}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.views{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.views button{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;
  padding:7px 14px;border-radius:999px;cursor:pointer;transition:color .2s,background .2s
}
.views button[aria-pressed="true"]{background:var(--shu);color:#fff}
.views button:hover{color:var(--text)}

/* pestañas de temporada */
.seasons{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px;width:var(--max);max-width:100%;margin:0 auto;scrollbar-width:none}
.seasons::-webkit-scrollbar{display:none}
.season-tab{
  flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  font:inherit;font-weight:700;font-size:14px;padding:8px 18px;border-radius:999px;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.9,.3,1.3),color .2s,border-color .2s,background .2s;
}
.season-tab:hover{transform:translateY(-2px);color:var(--text)}
.season-tab[aria-selected="true"]{background:linear-gradient(135deg,var(--shu),#ff8a3d);color:#fff;border-color:transparent}

/* ---------- héroe ---------- */
.hero{display:flex;gap:28px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:30px 0 22px}
.hero h1{
  font-family:var(--display);font-size:clamp(40px,8vw,74px);line-height:.92;margin:0;
  letter-spacing:.01em;text-wrap:balance;
}
.hero h1 span{color:var(--shu)}
.hero .sub{color:var(--muted);font-size:14px;margin-top:10px;max-width:58ch}
.hero .sub b{color:var(--text);font-weight:700}
.tiles{display:flex;gap:10px;flex-wrap:wrap}
.tile{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;min-width:108px;
  animation:rise .5s both
}
.tile .n{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;margin-top:4px}
.tile.live .n{color:var(--live)} .tile.soon .n{color:var(--soon)} .tile.plat .n{color:var(--amber)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- filtros ---------- */
.filters{
  position:sticky;top:64px;z-index:30;background:#121018ee;backdrop-filter:blur(10px);
  border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0 9px;display:flex;flex-direction:column;gap:5px;
}
.frow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.flabel{color:var(--muted);opacity:.65;font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;flex:0 0 66px}
.chip{
  border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:500;
  padding:3px 9px;border-radius:8px;cursor:pointer;
  transition:color .18s,border-color .18s,background .18s
}
.chip:hover{color:var(--text);background:var(--panel)}
.chip[aria-pressed="true"]{background:var(--panel-2);color:var(--text);border-color:var(--line);font-weight:700}
.chip.plat[aria-pressed="true"]{background:transparent;color:var(--text);border-color:var(--c,var(--shu))}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted));display:inline-block;margin-right:5px;vertical-align:1px;opacity:.9}
select.sel{
  border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;
  padding:3px 7px;border-radius:8px;cursor:pointer
}
select.sel:hover{color:var(--text)}
select.sel:focus-visible,.chip:focus-visible,.season-tab:focus-visible,.views button:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--soon);outline-offset:2px}
.count{color:var(--muted);font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}
.count b{color:var(--text)}
.clear{border:0;background:none;color:var(--shu);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:3px 4px}

/* ---------- rejilla ---------- */
.filters .frow:last-child{padding-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:20px;margin-top:22px}
@media(min-width:1700px){.grid{grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:22px}}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;position:relative;
  animation:pop .45s both cubic-bezier(.2,.8,.25,1);animation-delay:calc(var(--i,0)*28ms);
  transition:transform .25s cubic-bezier(.2,.9,.3,1.2),border-color .25s,box-shadow .25s
}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--c,var(--shu)) 60%,var(--line));box-shadow:0 22px 44px -22px var(--c,#000),var(--shadow)}
.poster{position:relative;display:block;width:100%;padding:0;border:0;background:#0d0c12;cursor:pointer;aspect-ratio:210/300;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .3s}
.card:hover .poster img{transform:scale(1.07)}
.poster .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;padding:10px;text-align:center}
.poster .shade{position:absolute;inset:auto 0 0 0;height:56%;background:linear-gradient(to top,#0d0c12f2,#0d0c1200)}
.tag{
  position:absolute;top:8px;left:8px;background:#0d0c12cc;border:1px solid #ffffff22;color:#fff;
  font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;backdrop-filter:blur(4px)
}
.score{
  position:absolute;top:8px;right:8px;background:#0d0c12cc;border:1px solid #ffffff22;color:var(--amber);
  font-family:var(--display);font-size:14px;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)
}
.fav{
  position:absolute;bottom:8px;right:8px;width:32px;height:32px;border-radius:50%;border:1px solid #ffffff2b;
  background:#0d0c12b8;color:#fff9;cursor:pointer;display:grid;place-items:center;padding:0;
  transition:transform .2s cubic-bezier(.2,.9,.3,1.5),color .2s,background .2s;backdrop-filter:blur(4px)
}
.fav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.fav:hover{transform:scale(1.15);color:#fff}
.fav[aria-pressed="true"]{color:var(--shu);background:#ff4b3522;border-color:var(--shu)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.t{font-size:14.5px;font-weight:700;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.studio{color:var(--muted);font-size:12.5px;margin:0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.when{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;margin-top:auto;font-variant-numeric:tabular-nums}
.when .pulse{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.when.is-live{color:var(--live)} .when.is-soon{color:var(--soon)} .when.is-tbd{color:var(--muted)} .when.is-done{color:var(--muted)}
.when.is-live .pulse,.when.is-soon .pulse{animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.eps{color:var(--muted);font-size:12.5px}
.plats{display:flex;gap:4px;flex-wrap:wrap}
.plat-pill{
  font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:5px;color:#fff;
  background:var(--c,#555);text-decoration:none;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  transition:transform .18s,filter .2s
}
.plat-pill:hover{transform:translateY(-2px);filter:brightness(1.18)}
.plat-none{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);padding:3px 7px;border-radius:5px}

/* ---------- lista ---------- */
.list{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.row{
  display:grid;grid-template-columns:72px 1fr auto;gap:18px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,var(--line));
  border-radius:13px;padding:12px 18px 12px 13px;cursor:pointer;
  animation:slide .4s both;animation-delay:calc(var(--i,0)*16ms);
  transition:transform .2s,border-color .2s,background .2s
}
@keyframes slide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.row:hover{transform:translateX(4px);background:var(--panel-2)}
.row img{width:72px;height:103px;object-fit:cover;border-radius:8px;display:block;background:#0d0c12}
.row .rt{font-size:16.5px;font-weight:700;margin:0 0 4px}
.row .rm{color:var(--muted);font-size:13.5px;display:flex;gap:12px;flex-wrap:wrap}
.row .rr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
@media(max-width:620px){.row{grid-template-columns:52px 1fr;gap:12px;padding:9px 12px}.row .rr{grid-column:2;align-items:flex-start;text-align:left}.row img{width:52px;height:74px}.row .rt{font-size:14.5px}.row .rm{font-size:12px;gap:8px}}

/* ---------- calendario ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:18px;margin-top:22px;align-items:start}
@media(max-width:1180px){.cal{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:820px){.cal{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.cal{grid-template-columns:1fr}}
.day.full{grid-column:1/-1}
.day.full ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:5px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;animation:rise .45s both;animation-delay:calc(var(--i,0)*40ms)}
.day h3{margin:0;padding:15px 17px;font-family:var(--display);font-size:25px;letter-spacing:.04em;
  background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.day h3 em{font-family:var(--body);font-style:normal;font-size:13.5px;color:var(--muted);font-weight:700}
.day.today h3{background:linear-gradient(135deg,var(--shu),#ff8a3d);color:#fff;border-color:transparent}
.day ul{list-style:none;margin:0;padding:10px}
.day li{display:flex;gap:15px;align-items:center;padding:12px 10px;border-radius:12px;cursor:pointer;transition:background .18s,transform .18s}
.day li:hover{background:var(--panel-2);transform:translateX(3px)}
.day li img{width:80px;height:114px;border-radius:8px;object-fit:cover;background:#0d0c12;flex:0 0 auto}
.day li .lt{font-size:16.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.day li .lh{color:var(--muted);font-size:13.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.day .none{color:var(--muted);font-size:13.5px;padding:16px 17px 20px}

/* ---------- vacío / carga ---------- */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h3{font-family:var(--display);font-size:26px;color:var(--text);margin:0 0 8px}
.skel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.skel .sp{aspect-ratio:210/300;background:linear-gradient(100deg,var(--panel) 30%,var(--panel-2) 50%,var(--panel) 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
.skel .sl{height:11px;margin:11px 12px;border-radius:6px;background:var(--panel-2)}
.skel .sl.w{width:60%}
@keyframes shim{from{background-position:120% 0}to{background-position:-20% 0}}

/* ---------- ficha (modal) ---------- */
.ov{position:fixed;inset:0;z-index:80;background:#09080cd9;backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;
  opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{
  width:min(960px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);transform:translateY(18px) scale(.97);transition:transform .32s cubic-bezier(.2,.9,.3,1.25);
  position:relative
}
.ov.on .sheet{transform:none}
.sheet .band{height:7px;background:linear-gradient(90deg,var(--c,var(--shu)),transparent)}
.x{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:#0d0c12c9;color:var(--text);font-size:18px;cursor:pointer;line-height:1;transition:transform .2s,background .2s}
.x:hover{transform:rotate(90deg);background:var(--shu);border-color:transparent;color:#fff}
.sheet-in{padding:24px;display:grid;grid-template-columns:230px 1fr;gap:26px}
@media(max-width:640px){.sheet-in{grid-template-columns:1fr;padding:16px}}
.sheet-in>.left img{width:100%;border-radius:12px;display:block;background:#0d0c12}
.sheet h2{font-family:var(--display);font-size:clamp(23px,4.4vw,34px);line-height:1.02;margin:0 36px 4px 0;text-wrap:balance}
.alt{color:var(--muted);font-size:13px;margin:0 0 14px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.b{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.b.hi{color:var(--text)} .b.live{color:var(--live);border-color:#48d6a055;background:#48d6a014}
.b.soon{color:var(--soon);border-color:#7ab8ff55;background:#7ab8ff14}
.syn{font-size:14px;color:#ded8e8;margin:0 0 6px;max-width:66ch}
.syn.empty-txt{color:var(--muted)}
.tr-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:12.5px;font-weight:700;
  padding:6px 12px;border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s}
.tr-btn:hover{border-color:var(--shu)}
.tr-btn[disabled]{opacity:.6;cursor:default}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:18px 0 0;font-size:13.5px}
dl.facts dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding-top:1px}
dl.facts dd{margin:0}
.where{margin-top:18px}
.where h4,.sec h4{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 9px;color:var(--muted)}
.where .links{display:flex;gap:8px;flex-wrap:wrap}
.wl{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#fff;background:var(--c,#555);
  font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;transition:transform .18s,filter .2s}
.wl:hover{transform:translateY(-2px);filter:brightness(1.15)}
.wl.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--text)}
.cd{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.cd .u{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;min-width:62px}
.cd .u b{display:block;font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.cd .u i{font-style:normal;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}

/* ---------- pie ---------- */
footer{border-top:1px solid var(--line);margin-top:46px;padding:22px 0 0;color:var(--muted);font-size:12.5px;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--text)}
.relink{border:0;background:none;color:var(--shu);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:0 2px;text-decoration:underline}
.relink[disabled]{color:var(--muted);cursor:default;text-decoration:none}
.upd{display:inline-flex;align-items:center;gap:7px}
.upd .pulse{width:7px;height:7px;border-radius:50%;background:var(--live);animation:beat 2.4s ease-in-out infinite}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,24px);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:10px 18px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:.28s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}.aurora i{animation:none}}
</style>

<script type="application/json" id="trad-es">{"195539":"Cyberpunk: Edgerunners 2 te devuelve a Night City, donde las vidas se enredan hasta el extremo. Weak, una leyenda cyberpunk venida a menos, se ve obligado a vivir sin implantes mientras busca un propósito en un mundo que lo dejó atrás. Mientras tanto, D, un nómada letal, emprende un camino de venganza que lo acerca a secretos corporativos que nunca debieron salir a la luz. A lo largo de esta serie independiente de diez episodios se despliega una historia sobre familia, obsesión y legado, y sobre cómo tu mirada refleja las historias de quienes te rodean. Cuando el mundo está cegado por el espectáculo, ¿hasta dónde hay que llegar para que tu historia importe? (Fuente: web oficial de Cyberpunk: Edgerunners 2 y su cuenta oficial)","195516":"Tras la rebelión del clan Shi las cosas por fin se han calmado y Maomao ha vuelto a su antigua vida como boticaria en el barrio del placer. Un día, a raíz de un desayuno servido en la Casa Verdigris, Maomao percibe una anomalía y empieza a investigar qué hay detrás. Mientras tanto, Jinshi, que ha revelado su verdadera identidad como hermano del emperador y ha empezado a asumir sus pesadas responsabilidades, vive atormentado por el último mensaje que dejó Loulan: la advertencia de un desastre inminente que golpeará a la nación. Para colmo, empiezan a correr rumores sobre una misteriosa sacerdotisa que engaña al pueblo, y una sombra vuelve a cernirse sobre el país de Li. Desde las profundidades de la corte interior hasta las calles de la ciudad y más allá de las fronteras, el mundo se ensancha y lo que está en juego para Maomao y Jinshi es cada vez mayor. (Fuente: Crunchyroll)","195604":"Mientras la tiranía se apodera del Reino del Trébol, Asta y los Caballeros Mágicos lanzan una incursión desesperada contra el Reino de la Pica para rescatar a sus capitanes de la Tríada Oscura. Pero la misión los arrastra a una batalla brutal contra fuerzas superiores a todo lo que han enfrentado. Ahora Asta tendrá que superar lo imposible para proteger a sus amigos y cumplir la promesa que le hizo a Yuno. (Fuente: Crunchyroll)","212888":"Sin Yeong-U, conocido como Grid, es un hombre sin suerte en la vida y un jugador de bajo nivel en Satisfy, el popular juego de realidad virtual. Un día encuentra un objeto poderoso que le otorga un título de clase legendaria muy raro: Sucesor de Pagma. Ahora es un herrero capaz de forjar armas únicas y de equiparse con lo mejor del juego. Grid decide aprovechar sus nuevas habilidades para ganar fama y fortuna, pero cuando su sola existencia empieza a alterar el equilibrio de Satisfy, descubre que la vida de una leyenda trae más problemas de los que esperaba. (Fuente: Tapas, editado). Nota: Tempal: Item no Chikara se estrenó con una semana de adelanto sobre la emisión en televisión en Prime Video y Crunchyroll desde el 27 de septiembre de 2026. La emisión regular comenzó el 2 de octubre de 2026.","205909":"En apariencia, Satoko lo tiene todo: es hermosa, hija de un noble y está en edad de casarse. Por desgracia, también está muy enferma y le queda poco tiempo de vida. Antes de poder cerrar un matrimonio que la redima a ojos de su familia, se convierte en el objetivo de Shinpei, un asesino misterioso, y sus planes se tambalean. Para salvarse, le hace una propuesta desesperada: casarse con él. Eso sí, en el amor Shinpei se toma muy en serio aquello de «hasta que la muerte nos separe». (Fuente: VIZ Media)","159042":"Segunda temporada de Tensei Shitara Ken Deshita. Nota: cada episodio se estrenó con una semana de adelanto sobre la emisión en televisión en Abema desde el 1 de octubre de 2026. La emisión regular comenzó el 8 de octubre de 2026.","191656":"Esto es la Academia Fujinasu, un instituto privado de alto rendimiento a las afueras de la ciudad. Ume Mizunoe, de primero de bachillerato, tiene notas excelentes en lengua japonesa y ha ganado varios premios literarios. Sus pésimas calificaciones en ciencias, en cambio, ponen en riesgo su paso de curso, así que, para no repetir, entra en el consejo estudiantil con la esperanza de mejorar su expediente. Allí se topa con la carismática y huraña presidenta Hisako Kotobuki y con la temible pero amable y refinada tesorera Arisu Terui. También están Tan Otori, un chico descarado y adorable, y Komaro Michinoku, el administrativo que parece un gatito abandonado. Así arranca una comedia romántica disparatada y con corazón sobre un consejo estudiantil desbordado y lleno de gente entrañable y peculiar. (Fuente: web oficial de la serie)","189123":"Segunda temporada de Ao no Hako. Mientras Taiki y Chinatsu navegan unos sentimientos que cambian, una amistad rota del pasado y una competencia feroz enturbian el camino hacia el campeonato nacional. (Fuente: Netflix, editado)","207329":"Rein, un encantador, es expulsado de su gremio de un día para otro. Lejos de hundirse, declara que ahora por fin puede hacer lo que quiera y empieza a recuperar la enorme cantidad de puntos de mejora que había volcado en el equipo de sus excompañeros, iniciando un camino nuevo como aventurero. A su alrededor se reúne gente con heridas que no cierran: una aventurera genial que cerró su corazón tras la masacre de su grupo, una guerrera que perdió a su familia y una asesina criada desde niña para matar. Rein nunca rechaza su pasado ni sus cicatrices: las acepta con una calidez luminosa y directa. El escenario es un mundo de fantasía peculiar donde conviven subfusiles, tirachinas e incluso yakuza. En ese mundo, cuanto más depende la gente de la tecnología cómoda, más se debilita su magia y más frágiles se vuelven los aventureros. Monstruos inteligentes y crueles campan a sus anchas mientras en el bajo mundo los forajidos exhiben su codicia entre conspiraciones y traiciones. En un lugar donde los ideales y la justicia se aplastan con facilidad, los aventureros siguen luchando solo con su magia y sus convicciones. Esta es la historia de quienes perdieron su sitio en el mundo y encuentran una nueva forma de vivir. ¡La segunda vida libre y salvaje de Rein y sus compañeros empieza ya! (Fuente: web oficial de la serie)","210482":"En la segunda etapa, una travesía por el desierto de unos 1.200 kilómetros, la tierra que Johnny Joestar y Gyro Zeppeli deben atravesar alberga la zona temida como la Palma del Diablo. En 1875, una amenaza oculta en ese desierto aniquiló a una caballería de veintiséis personas y sembró el terror entre los pueblos originarios de la región. A medida que se suceden sucesos siniestros, ambos se ven obligados a aceptar que esta carrera es mucho más que una competición. Los dos siguen adelante, allí donde chocan incontables intenciones ocultas. (Fuente: Warner Bros. Japan Anime y Netflix Anime, editado)","160275":"Secuela de Made in Abyss: Retsujitsu no Ougonkyou.","143103":"Aoko Aozaki es una estudiante de instituto aparentemente normal que en realidad es una maga en el mundo moderno, aunque todavía es solo una aprendiza. Mientras pasa los días junto a su compañera de piso, Alice Kuonji, esforzándose por convertirse en una maga de pleno derecho, la chica conoce a un chico. Así empieza la historia de una joven: el relato de una bruja. (Fuente: Crunchyroll)","213805":"Koyuki, la chica aislada; Miki, la antigua ídolo del colegio; Minato, el chico que no entiende de espacio personal, y Youta, el amable jugador de baloncesto. Torpe, frustrante y profundamente entrañable, este drama coral sobre crecer y sobre corazones que se cruzan sigue adelante. A medida que se acercan, Koyuki y Minato empiezan a sentir algo que va más allá de la amistad. Mientras tanto, Youta por fin le confiesa a Miki lo que lleva años guardando. Unos dicen lo que sienten y otros lo esconden, así que sus caminos y sus sentimientos no dejan de cruzarse y de pasar de largo. (Fuente: Netflix)","178083":"Secuela de Tokyo Revengers: Tenjiku-hen.","172192":"En una tierra dominada por los temibles Mundos de Sombra, la humanidad ha quedado casi aniquilada. Seis héroes valientes libran una batalla desesperada para salvar el planeta de su destrucción… y fracasan. Pero queda un rayo de esperanza cuando Desir, uno de los últimos magos, es enviado de pronto trece años atrás en el tiempo. Con el conocimiento de ese futuro sombrío, ¿podrá cambiar el curso de la historia y salvar el mundo? (Fuente: Crunchyroll)","199340":"«En realidad, yo soy Touko Kirishima». El público estalla al descubrir que la identidad de la misteriosa y popularísima cantante de internet no era otra que Mai Sakurajima, la actriz favorita del país. La escena es idéntica al sueño que Sakuta Azusagawa tuvo en Nochebuena. A partir de la confesión de Mai el 1 de abril, los imposibles que todo el mundo soñó alguna vez empiezan a suceder uno tras otro. La etiqueta «#Yumemiru», donde los sueños se cumplen, ha desaparecido, y mientras Sakuta lidia con el desajuste entre la realidad que tiene delante y lo que él percibe, recibe un mensaje de una versión de sí mismo en una realidad alternativa: detén a Touko Kirishima antes de que la realidad se reescriba. Para devolver el mundo a su estado original, Sakuta sale a buscarla. Esta es una historia sobre superar el síndrome de la adolescencia. (Fuente: Crunchyroll News, editado)","207191":"«Prepárame una poción de amor». Con esa sola frase, el enamoramiento secreto de la Buena Bruja del Lago por el apuesto sir Harij se rompe en pedazos. Aun así, cuando él se ofrece a ayudarla a reunir los ingredientes, Rose se emociona ante la oportunidad de contemplar a un hombre con el que normalmente jamás trataría. Aprende a contener el corazón desbocado durante sus conversaciones tirantes de siempre… pero ¿qué se supone que debe hacer cuando él aparece sin más en su puerta con pan y un tarro de mantequilla de manzana? (Fuente: Yen Press)","200929":"Se abre el telón de un nuevo misterio en torno a un tesoro escondido en una ciudad sobre el agua. El emperador le da una orden a Jinshi: debe cumplir el último deseo de una concubina fallecida hace cinco años y devolverla a su tierra natal. Al examinar los restos para entregarlos a la familia, descubre que están intactos. La mujer sigue siendo hermosa, como si estuviera viva. Para resolver el misterio, Jinshi arrastra a Maomao en un viaje a Binan-shu, la provincia del sur que gobierna el clan Bi. Llegan a una ciudad bulliciosa levantada sobre el agua. Maomao se entusiasma con hierbas y remedios que nunca había visto, pero la tensión se palpa: unos piratas buscan con saña el tesoro que escondió su difunto líder. «Ojalá no pase nada…». El presentimiento de Jinshi se cumple. El día del funeral de la concubina estalla un gran incidente que desencadena una cadena de sucesos que nadie vio venir. (Fuente: Crunchyroll)","206814":"Han pasado varios años desde la feroz batalla contra Majin Buu y la Tierra por fin disfruta de un momento de paz. Al mismo tiempo, Bills, el dios de la destrucción, despierta de su largo sueño. Incluso los Kaio y el Supremo Kaio, conscientes de su poder capaz de destruir planetas enteros, observan ese despertar con auténtico miedo. Entretanto, Bills oye rumores sobre un saiyan que derrotó a Freezer y aparece de pronto ante Goku. Con el ser más fuerte del universo apuntándola, la Tierra corre un peligro enorme. Así arranca una batalla cósmica descomunal entre el dios de la destrucción y Goku y sus aliados, un conflicto que sacudirá el universo entero. (Fuente: web oficial). Nota: edición mejorada de Dragon Ball Super, con gran cantidad de planos nuevos y redibujados, una narración reconstruida y un apartado visual actualizado para acercarse más al manga original de Akira Toriyama.","206949":"Una gran heroína yace invicta en su lecho de muerte, lamentando no haber encontrado jamás a un rival capaz de derrotarla. Nunca pensó en morir fuera del campo de batalla, y su final apacible la deja deseando con todas sus fuerzas que las cosas hubieran sido de otro modo. Cuando despierta en el cuerpo de Nia Liston, una niña frágil y enfermiza, le espera una batalla completamente nueva. Nia es una criatura débil, así que le queda mucho camino por delante antes de estar en forma para pelear. Pero ahora que tiene una segunda oportunidad, está decidida a conseguir lo que quiere: esta vez va a vivir, y a morir, por el combate. ¡Abran paso a la doncella despiadada! (Fuente: J-Novel Club)","186541":"Takahiro Sato era un oficinista corriente y jugador aficionado hasta el día en que despertó en una nave espacial, y no en una cualquiera, sino en una sospechosamente parecida a la de su juego de naves favorito. Con un navío equipadísimo, una tripulación llena de chicas guapas y un universo fantástico por explorar, piensa aprovechar su buena suerte para construirse la vida que siempre soñó. (Fuente: Seven Seas Entertainment)","208025":"Amona es una invocadora oscura con poderes demoníacos. Roni es un sacerdote devoto y demasiado estirado. En teoría deberían odiarse. En la práctica, aceleran su arco de enemigos a amantes con una noche juntos que se empeña en repetirse. Ahora tienen que esconder lo suyo del resto del grupo mientras niegan la atracción que crece entre ellos y lidian con un diablillo demasiado implicado en su vida amorosa. (Fuente: HIDIVE)","185756":"Tercera temporada de Tensei Kizoku, Kantei Skill de Nariagaru. Nota: el 4 de septiembre de 2026 se anunció que GeyeG Pictures asumía la producción en lugar del estudio MOTHER, manteniendo al mismo equipo.","191788":"El juego de Ashito Aoi le ha valido un puesto en el equipo A, pero su nueva realidad lo supera enseguida. Rodeado de jugadores de élite como Kuribayashi y Akutsu, los entrenamientos son tan despiadados como los partidos. En esta Premier League sub-18 llena de talento, Ashito tendrá que evolucionar o quedar aplastado si alguna vez quiere que lo reconozcan. (Fuente: Crunchyroll)","202250":"Si hay algo de lo que nunca se tiene suficiente en un mundo de espada y brujería al estilo RPG son los puntos de magia. Da igual si alimentas hechizos, técnicas o una habilidad espectacular: hay que gastar puntos para hacer daño de verdad. ¿Y qué pasa cuando se acaban? Lent forma parte de los Perforacielos, un grupo en ascenso, y gracias a su don único puede prestar cantidades enormes de magia a los demás. Con él cerca, quedarse sin maná no es problema. El detalle es que, ahora que sus compañeros se han vuelto héroes formidables gracias a su habilidad, empiezan a cuestionar para qué sirve él. Expulsado del grupo, Lent está furioso… hasta que descubre un poder oculto en su don. Ahora, con su adorable y maliciosa hada como socia, piensa reclamar hasta la última gota de magia que prestó a sus excompañeros, con intereses. (Fuente: Seven Seas Entertainment)","169581":"Pocos títulos son tan venerados entre los salidos (perdón, entre los connoisseurs de los juegos eróticos japoneses) como Magical Explorer. Un día, nuestro héroe amante del cachondeo despierta reencarnado en el cuerpo del galán protagonista del juego. O más bien en el de su mejor amigo, Kousuke Takioto, el alivio cómico de la función. Pero con su conocimiento insuperable de Magical Explorer y las habilidades poco ortodoxas de Kousuke (¿una bufanda que también es un puño?), promete convertir al perdedor más desgraciado del juego en su mayor rompecorazones. En este mundo, nada queda fuera de tu alcance si tienes la información. (Fuente: Yen Press). Nota: cada episodio se estrenó con una semana de adelanto en ABEMA y d anime store. La emisión original en televisión empezó el 4 de octubre de 2026.","152677":"Después de frustrar un secuestro aéreo junto a Siesta, la bella detective de pelo plateado, Kimihiko lleva una vida de viajes por el mundo y casos resueltos… hasta que Siesta muere. Un año más tarde, un caso nuevo reabrirá viejas heridas entretejiendo asesinato, conspiración y a su compañera muerta. (Fuente: Crunchyroll)","213457":"La Tierra de un futuro lejano está cubierta por nubes espesas y el sol ya no brilla. Las plantas se marchitan y el oxígeno escasea. Para combatir la extinción, la humanidad ha desarrollado una tecnología que convierte a las personas en plantas, de modo que aporten algo de oxígeno. ¿Es sostenible ese proceso? ¿Es ético? Toshiro Kamiya tendrá que plantearse esas preguntas mientras afronta una decisión difícil: salvar a su familia o salvarse a sí mismo. Kamiya está al límite. Su madre está enferma y su trabajo apenas cubre la medicación, mucho menos la comida. Con pocas opciones, considera someterse al proceso de transfloración, que le cambiaría la vida. Dispuesto a entregar su cuerpo a cambio de dinero, Kamiya está a punto de explorar los límites de una humanidad en retirada. (Fuente: VIZ Media)","204389":"Segunda temporada de Yasei no Last Boss ga Arawareta!","205896":"Makoto Takatsuki, jugador de rol, es arrojado a otro mundo con habilidades y estadísticas pésimas. Pronto conoce a una diosa llamada Noah, que le pide convertirse en su primer creyente a cambio de sus bendiciones. (Fuente: J-Novel Club)","204011":"Un día, el estudiante de instituto Ageha Yoshina recoge una misteriosa tarjeta telefónica roja olvidada en una cabina. Unos días después, su amiga de la infancia y compañera de clase Sakurako Amamiya, que tenía una tarjeta idéntica, desaparece sin dejar rastro. Al buscarla, Ageha se ve arrastrado a los rumores sobre una cadena de desapariciones por todo el país, atribuidas a una organización secreta conocida solo como Psyren. Cuando accede al grupo, empieza un juego mortal que cambiará su destino para siempre. (Fuente: web oficial de PSYЯEN)","209502":"Sato-san es la flor inalcanzable de la clase. Siempre es fría y cortante con sus compañeros, pero solo yo sé que en realidad es adorable cuando sonríe, aunque no se le dé nada bien la fotografía. Oshio-kun es simpático y animado, pero solo yo sé que después de clase trabaja en la cafetería de su familia. Lleva de maravilla las redes del local y su sonrisa traviesa me acelera el corazón. Inocente y dulce, a veces exasperante: una historia cien por cien esponjosa sobre dos personas que se enamoran por primera vez.","209219":"A Akira Yagami, un oficinista, su carácter altruista suele costarle caro. Cuando muere tras salvar a un niño de ser atropellado… reencarna en otro mundo como goblin. Normalmente los goblins viven solo siete días, pero sus nuevos poderes le permiten burlar esa esperanza de vida y son la clave de su camino para convertirse en el goblin más fuerte de la historia. (Fuente: Yen Press). Nota: la serie se estrenó con una semana de adelanto sobre la emisión en televisión en ABEMA y Prime Video, a partir del episodio 2, el 5 de octubre de 2026.","212503":"Antes lo tomaban por el único alumno corriente de la elitista Academia de Hechicería Arnold, pero Ray White, en secreto el Hechicero de la Hoja de Hielo, por fin se ha ganado su lugar. El nuevo curso trae un nuevo reto: la Guerra de Magias, una gran competición que enfrenta a equipos de escuelas rivales. Sobre Ray y sus amigos, sin embargo, se cierne una sombra inquietante mientras los demás grandes hechiceros mueven ficha. (Fuente: Crunchyroll)","211778":"Después de usar Internet, su habilidad de rango SSS, para desbaratar las ambiciones de su antigua familia, Lorna es libre de recorrer el mundo. Su siguiente parada es Aquas, una ciudad portuaria donde espera hacer turismo y ponerse morada de marisco. Al llegar, sin embargo, el lugar está al borde de la destrucción por culpa de cierta misión semanal… Menos mal que Lorna tiene a los dioses de su parte. (Fuente: Crunchyroll)","204650":"Tras combatir en Kioto y en Nerima, los estudiantes de la Academia Rasetsu se han vuelto más fuertes. Pero Yaoroshi abandona la academia para unirse a la Brigada Oni y su plan de erradicar por completo a los Momotaro. Cuando Shiki descubre que también van a por quienes no combaten, sale tras Yaoroshi para hacerlo volver. Mientras tanto, en Nikko hay un centro de investigación donde se realizan experimentos atroces sobre las antiguas cataratas de Kegon. (Fuente: REMOW)","187402":"Fia siempre soñó con ser caballero. Nacida en una familia de caballeros, es la menos dotada de todos, pero se aferra a su sueño y entrena con todo lo que tiene. El día en que debe matar a un demonio pequeño para demostrar su valía acaba cara a cara con un dragón. Una herida mortal le hace ver su vida pasar… y de pronto recuerda su vida anterior, cuando fue una Santa poderosa de otra época que derrotó al Rey Demonio. Aquella vida terminó en dolor precisamente por lo que era, así que teme volver a ser una Santa. Ahora que la magia de su vida pasada se ha reavivado, puede convertirse en una caballero más poderosa de lo que jamás soñó, siempre que sobreviva lo suficiente. (Fuente: Seven Seas Entertainment). Nota: la serie se estrenó con una semana de adelanto en ABEMA, Prime Video y Crunchyroll, con el episodio 2 publicado junto al 1.","180894":"Romelia y su grupo logran derrotar al Rey Demonio Zelgis, aunque la carga temeraria del príncipe Henri los arrastra a una batalla agotadora. Después, a Romelia la tachan de lastre por no haber luchado en primera línea y el príncipe rompe el compromiso de forma unilateral. Excluida de las celebraciones por la victoria, vuelve a casa y se encuentra con la indiferencia fría de su familia y de la sociedad. Aun así, no se rompe: ya tiene la mirada puesta en el camino que viene. (Fuente: Crunchyroll). Nota: Romelia Senki se estrenó con dos días de adelanto sobre la emisión en televisión en AnimeTimes, U-NEXT y Netflix desde el 3 de octubre de 2026. La emisión regular comenzó el 5 de octubre de 2026.","206401":"Kurumi Fukuga, estudiante universitaria, por fin cumple su viejo deseo de meterse en el mercado de divisas, con la idea de recuperar los veinte millones de yenes que perdió su difunta madre operando. «Los recupero enseguida», piensa, pero el mundo en el que entra puede ser el cielo o el infierno en cuestión de segundos. Pérdidas latentes, cortes de posición, oscilaciones que no paran… y aun así ella quiere seguir comprando, vendiendo y ganando. Con sus colegas adictas al mercado, Mochiko, Mebuki y Yasuko, la cosa se calienta. Euforia, desesperación, euforia, desesperación: un juego de dinero entrañable y bastante arriesgado. ¿Sobrevivirán Kurumi y sus amigas a este mundo tan turbulento? (Fuente: Crunchyroll)","209872":"Tercera temporada de Ranma 1/2 (2024). Más rivales y más líos persiguen a Ranma y Akane mientras Colonia entrena a Ryoga, una guerra de galletas se descontrola y Shampoo trama planes nuevos. (Fuente: Netflix, editado)","195571":"La Máscara otorga poder a quien se la pone. A veces eso significa posibilidades infinitas; otras, una tragedia inimaginable. Peru, discípulo del legendario fabricante de máscaras Gaston Roux, queda bajo el control de la Máscara del Dios Guerrero y mata sin querer a sus amigos e incluso a su propio maestro. Para evitar que esa tragedia se repita, Peru jura destruir todas las máscaras de Gaston repartidas por el mundo. Enfrentado a sus propios pecados, emprende el viaje. Conoce a nuevos amigos y se topa con enemigos poderosos, y el muchacho sigue adelante hasta el día en que pueda expiar lo que le hizo a su maestro. (Fuente: web oficial de The Vermillion Mask)","186742":"Esta es la historia de cuatro chicas que viven en el «lado oscuro» de Ciudad Academia. En esa ciudad, donde los poderes psíquicos se estudian como una ciencia más, tras la fachada de paz opera una organización clandestina que asume misiones que no pueden hacerse públicas. ITEM es una unidad de élite formada por cuatro chicas. Rikou Takitsubo puede leer y rastrear los campos AIM que emiten los esper. Frenda Seivelun domina el combate con explosivos y trampas. Saiai Kinuhata manipula el nitrógeno a voluntad y cumple el papel defensivo. Y Shizuri Mugino es una de las siete esper de nivel 5 que son el orgullo de la ciudad. Viven a su aire en la oscuridad de Ciudad Academia mientras fijan en silencio su objetivo. Una historia de encuentros, amistad y tinieblas que acabará desembocando en un incidente terrible. (Fuente: Kadokawa, traducido)","198727":"Segunda parte de Chitose-kun wa Ramune Bin no Naka.","176314":"Segunda temporada de Sasaki to Pii-chan.","178972":"Película antología formada por tres segmentos de animación originales. Q1 - ÆLIENS: la Tierra ha entrado en una era de intercambio interplanetario. Mientras el miedo y los prejuicios hacia los alienígenas se extienden por la sociedad, una joven alienígena llamada Elie llega como embajadora interestelar de buena voluntad. Adora la cultura terrestre y su vida cotidiana maravillosamente absurda, y se alía con Kento Kunikura, funcionario de la Oficina Espacial, para buscar «amigos» por todo el planeta. Pero los poderes de Elie a veces se le van de las manos. Rodeada de secretos, pronto atrae la atención y la sospecha de la gente, que empieza a verla como una invasora. Y entonces, sin previo aviso, aparecen alienígenas hostiles. Q2 - Yoroshiku★Shoujo: en la ciudad de GALs TOKYO nunca amanece. Cada noche se reúnen allí las llamadas Gal P, chicas que ya no tienen un sitio en el mundo real. Todas persiguen lo mismo: ganar el juego Queen of Butterfly, QoB para abreviar, y hacerse con el título de reina. STELLA, una chica que ha dejado de ir a clase, oye los rumores de esa leyenda urbana y se lanza al juego mortal. Las chicas matan y caen, dispersándose como mariposas en la noche. En medio del caos, STELLA se cruza con una joven misteriosa que porta un arma de rango SSS y un poder abrumador, y a través de ella descubre la verdad que esconde el juego. Q3 - Nocturne: en esta noche grotesca: en un mundo donde la humanidad ya se ha extinguido, Ayame, una vampira de sangre pura, viaja en un vagón junto a tres chicas que sobrevivieron al infectarse con su sangre. Sobre ellas, un cielo de estrellas incontables ilumina la noche como si fuera de día, y los campos dorados brillan sobre una tierra en ruinas. A ojos de una vampira, incluso un mundo devastado puede ser de una belleza sobrecogedora. Juntas, las chicas atesoran los pequeños momentos de vida que quedan en ese mundo vacío. «Aunque el cuerpo de una vampira perezca, el alma nunca desaparece». Cuando Ayame pronuncia esas palabras en voz baja, Shion percibe la soledad y la desesperación de quien está condenada a vivir para siempre. Un día, algo extraño empieza a ocurrirle a Ayame y la rutina inmutable de las chicas comienza a resquebrajarse. (Fuente: Aniplex USA)","200455":"Renací como la villana de un otome game de harén inverso. Tras pasar unas fiebres altísimas a los diez años, Pia Rockwell recuerda de golpe su vida anterior como universitaria en Japón. Pero, lejos de seguir la ruta de la villana, lo único que quiere esta chica timidísima es aprovechar por fin lo que aprendió cuando hacía el doctorado en paleontología. Su meta es convertirse en plebeya, excavar fósiles, levantar un museo y acabar siendo su conservadora. Así que, para escapar de la ruta de la villana y evitar que su prometido la destierre durante el baile de graduación, Pia decide adelantarse al disgusto y pedirle a Rufus, el hijo del primer ministro, que rompan el compromiso. ¿La dejará marchar tan fácilmente ese prometido tan astuto?","211877":"Por primera vez en mi vida tengo novia. Pero su amiga me tienta con un cuerpo tan seductor… ¿Qué harías tú si la amiga de tu novia se te insinuara así? (Fuente: Yanmaga, traducido)","207327":"La historia sigue a Kazuki Tsukigase, un chico que se traslada a un instituto de una isla remota para alejarse de todo el que lo conoce. Allí descubre que en la isla hay una cala donde, según los rumores, desaparece la gente. Al explorarla, encuentra a una chica inconsciente. Cuando ella despierta, después de que Kazuki la lleve al ambulatorio, es incapaz de decir nada sobre sí misma salvo que se llama Nao, que tiene dieciséis años y que susurra un año: 1974. (Fuente: Anime News Network, editado)","203275":"Yuuma Ashihara, de sexto de primaria, y su hermana melliza Sawa están jugando a Actual Magic, un MMORPG de realidad virtual recién estrenado, cuando el juego empieza a fusionarse con el mundo real. Entre el caos y la confusión queda claro que la muerte acecha en cada esquina, también cuando Yuuma se topa con su compañera Sumika, que era una de las chicas más guapas de su clase y ha sufrido una metamorfosis horrible: se ha convertido en uno de los monstruos del juego. Del autor de Sword Art Online y Accel World llega una historia más allá de la realidad virtual y aumentada, donde el juego y la realidad son lo mismo y seguir vivo es solo el principio. (Fuente: Yen Press)","190054":"A medida que se acerca el gran día, Miyo y Kiyoka sienten que su amor se hace más hondo. Y cuando Miyo va a una clase de cocina con Hazuki, se encuentra con una antigua compañera de clase. (Fuente: Netflix Anime)","178868":"Hikaru Shidou, Umi Ryuuzaki y Fuu Hououji no son de Céfiro. Durante una excursión escolar a la Torre de Tokio, las tres chicas tienen la cabeza en cualquier cosa menos en mundos mágicos y maravillosos. Hasta que la princesa Esmeralda, el Pilar de Céfiro, implora a las Guerreras Mágicas que salven su mundo, y resulta que esas guerreras son justamente ellas. (Fuente: Crunchyroll)","199007":"Será una ciudad en ruinas arrasada por los zombis, pero para Aki y sus amigos es alucinante. Criada oyendo solo historias del viejo mundo y del misterioso brote que acabó con la humanidad, sale con sus amigos de la infancia en busca de su padre desaparecido. Fuera de la seguridad de su pequeña aldea, todo se convierte enseguida en una lucha por sobrevivir, y aun así nunca se habían sentido tan vivos. (Fuente: Crunchyroll)","213657":"Segundo cour de la segunda temporada de Yozakura-san Chi no Daisakusen.","209499":"Shizuka acepta los encargos de asesinato más peligrosos, pero no es ella quien mata. Quien lo hace es su hermano Nagi, un asesino temible que recibió un disparo al protegerla y quedó en estado de coma, obligado a moverse en silla de ruedas. Shizuka, sin embargo, ha dado con la clave para despertarlo: tiene que enfrentarse a la intención de matar. Así arranca un viaje violento hacia la recuperación, peleando contra los enemigos más peligrosos. (Fuente: Kodansha USA)","206774":"¿Y si pudieras manejar la realidad con el cursor del ratón? Un día, en clase, Takumi, un otaku, se da cuenta de que su cursor ha salido de la pantalla. Asustado, le pide a Mone, su amiga de la infancia sentada al lado, que lo mire, pero ella lo ignora. Cuando descubre que puede controlarlo él mismo, usa ese cursor, visible solo para él, para colarlo bajo la ropa de Mone y empieza a hacer clic. Llega el que es, probablemente, el primer género nuevo de comedia romántica de Japón: «hacer clic con el ratón a una gyaru que trata mal a los otakus». (Fuente: web oficial). Nota: el episodio 1 se publicó por adelantado en AnimeFesta el 11 de septiembre de 2026. La fecha de inicio corresponde al comienzo de la emisión regular.","187316":"Riliu y Jowy siempre han luchado codo con codo soñando con un futuro lejos del campo de batalla. Pero cuando la guerra envuelve al Reino de Highland, los dos amigos de la infancia se ven arrastrados a un conflicto mucho mayor que ellos. Mientras las 108 Estrellas del Destino empiezan a reunirse, los chicos deberán afrontar una guerra que pondrá a prueba sus convicciones y su amistad. (Fuente: Crunchyroll). Nota: el primer episodio se emitió con una duración de unos 50 minutos, frente a los 24 habituales.","212799":"En el corazón de un continente de ocho reinos se encuentra el Reino de Marronnier. Su general, Baribara, tiene siete hijos, cada uno con un don propio y todos al mando de una orden de caballería. Unidos por una sola causa noble, la de rescatar algún día heroicamente a una princesa, los hermanos parten como embajadores de buena voluntad hacia los siete reinos vecinos. ¿Qué encuentros, pruebas y destinos les esperan en esas tierras desconocidas? (Fuente: Amazon Prime Video)","200294":"¡La pareja policial definitiva llega para mantener el orden! Nao es una agente recién incorporada, cinturón negro de judo y apodada «Gorila» por su fuerza descomunal. Su compañero es Chojo, que domina todos los poderes psíquicos imaginables, aunque para alguien que lee la mente sigue sin enterarse de nada. Ahora los dos combaten el crimen juntos en Chinjuku. (Fuente: Crunchyroll)","160803":"Algunas chicas mágicas pelean; otras no. Elegidas por la misteriosa Tierra de la Magia, que existe sin que el resto del mundo lo sepa, cada una recibe un poder propio. Pechka, cuya magia hace que la comida esté deliciosa, se ve obligada a participar en un extraño juego virtual junto a otras dieciséis chicas mágicas desconocidas, cada una con su carácter. Se suponía que era un entrenamiento seguro para mejorar sus habilidades, pero en realidad es el comienzo de una pesadilla cuidadosamente orquestada: una prueba prohibida. Ha empezado un nuevo Magical Girl Raising Project. (Fuente: OceanVeil)","203473":"Las leyendas urbanas cobran vida. Todo el mundo ha oído alguna, pero pocos se han topado con una de frente. Estos fenómenos están por todas partes, agazapados en las sombras de la realidad, y cada vez aparecen más desde que se avistó por todo Japón a la niña sin rostro. Si te cruzas con ella o con alguna de las leyendas que arrastra, reza para que el chico de la capucha roja te encuentre antes de que sea tarde: solo no tienes ninguna posibilidad, pero con su ayuda quizá vivas un día más. (Fuente: Yen Press)","177704":"Tercera temporada de MASHLE, que adapta el arco del examen final del Triatlón Mágico de los Videntes Divinos.","189323":"Tercera temporada de Shangri-La Frontier.","186822":"Aya, una chica de instituto moderna y optimista, se enamora hasta las trancas de un empleado de una tienda de discos del barrio. Tiene un aire misterioso, un estilo estupendo y un gusto musical impecable. Lo que no sabe es que ese supuesto chico es en realidad su compañera de clase Mitsuki. Mitsuki suele ir a lo suyo, pero como se sienta justo al lado de Aya no puede evitar ser muy consciente de ese enamoramiento. Contarle la verdad está descartado, aunque acercarse un poco más a Aya tampoco suena tan mal. (Fuente: Yen Press)","169579":"Segunda temporada de Sekai Saikou no Ansatsusha, Isekai Kizoku ni Tensei suru.","171630":"Para conmemorar el 25.º aniversario del anime de ONE PIECE, THE ONE PIECE, producido por WIT Studio, recrea la historia del manga original desde el arco de East Blue. (Fuente: Netflix, editado)","204363":"Segunda temporada de SAKAMOTO DAYS.","197620":"Corre la era Sengoku. Japón está fracturado en multitud de territorios independientes enredados en una guerra constante. En el centro está Ashina, una tierra sagrada y llena de misterio. Dos décadas después de que el Santo de la Espada, Isshin Ashina, recuperara la región en un golpe brutal, surge una amenaza desde dentro: el Ministerio del Interior. Desesperado por proteger su tierra, Genichiro, el nieto de Isshin, recurre a poderes prohibidos. La única esperanza está en un niño secuestrado, el Heredero Divino, y en su protector silencioso: un shinobi leal al que solo conocen como Sekiro. Esta es la historia de un señor y su vasallo, y de su empeño por devolver el equilibrio a una nación al borde del abismo. (Fuente: Crunchyroll)","204747":"Segundo cour de la tercera temporada de One Punch Man.","181951":"Segunda temporada de Ookami to Koushinryou: MERCHANT MEETS THE WISE WOLF.","213752":"Segunda temporada de MARRIAGETOXIN.","202564":"Los polos opuestos se atraen en esta comedia romántica desternillante sobre dos dibujantes de manga de instituto a los que nada les sale bien. Yuuki Uehara, un estudiante algo pardillo, ha creado la heroína perfecta de comedia romántica: tímida, despistada y completamente casta. Cuando un editor de la editorial de sus sueños despacha su manga tachándolo de tópico y poco realista, Uehara cae en una espiral de desesperación que lo pone en el camino de Niina Miyamoto, su compañera de clase, guapísima y burbujeante, y también aspirante a mangaka. Como a ella le han dicho algo parecido de su obra, Miyamoto le propone fingir que son pareja, ya que ninguno de los dos tiene experiencia amorosa. Pero Miyamoto no se parece en nada a la heroína perfecta que imaginó Uehara, y él desde luego no es el héroe chulesco de la historia de ella. ¿Convertirá esa relación disparatada sus sueños en realidad o solo traerá más desastres cómicos? (Fuente: Seven Seas Entertainment)","204579":"La chica que se sienta a mi lado al empezar el curso es la famosa chica «mina antipersona»… Pero ¿de verdad Chihara-san es lo que todos dicen? (Fuente: Ganma!, traducido)","209980":"Segunda temporada de Isekai de Cheat Skill wo Te ni Shita Ore wa, Genjitsu Sekai wo mo Musou Suru.","217070":"Segundo cour de Futsutsuka na Akujo de wa Gozaimasu ga: Suuguu Chouso Torikae Den. Gracias a Reirin y Keigetsu, los disturbios que una maldición provocó en la corte interior se han calmado. Durante su intercambio de cuerpos, ambas descubrieron cómo era la otra y entre ellas brotó una amistad. Pasan las estaciones y llega el principio del otoño. El ritual en el que el príncipe heredero y las doncellas piden una cosecha abundante, la Fiesta de la Cosecha, se celebrará en las tierras del sur que gobierna el clan Shu. Sin una consorte que la ampare, Keigetsu avanza a duras penas con los preparativos, presionada por ser la anfitriona. Reirin, mientras tanto, la apoya con todo su empeño y está entusiasmada con su primera salida oficial. Sin embargo, nada más llegar ocurre un accidente imprevisto y el ritual se interrumpe. El hechizo de una Keigetsu alterada se descontrola y vuelve a intercambiar cuerpos con Reirin. Para colmo, en mitad de la confusión secuestran a Reirin, ya en el cuerpo cambiado. Los dos hermanos sobreprotectores de Reirin, Kou Keikou y Kou Keishou, se meten de por medio y la situación toma un rumbo inesperado. ¿Quién es el nuevo cerebro que se acerca sigiloso para inculpar a Keigetsu? El gratificante relato de dos destinos intercambiados por dos chicas opuestas levanta el telón de su segundo acto: el arco de la primera salida oficial. (Fuente: web oficial)","188892":"Segunda temporada de Kuroiwa Medaka ni Watashi no Kawaii ga Tsuujinai.","216624":"Una torre misteriosa infestada de monstruos ha aparecido de la nada y atrae a cazadores dispuestos a jugarse la vida por la gloria y el dinero. Gong-Ja Kim, un cazador débil de rango F, se pasa los días envidiando al Emperador de las Llamas, que reina como el mejor de todos. Su oportunidad llega cuando se alía con el Emperador de la Espada y obtiene una rara habilidad de rango S, con una pega: para activarla tiene que morir. (Fuente: Crunchyroll, editado)","190244":"Secuela de Date A Live V.","196333":"Con una forma despreocupada de ver la vida, Hiroto sabe mejor que nadie que a veces frenar es la mejor manera de avanzar. A sus 29 años no tiene novia, ni un trabajo fijo, ni planes de futuro, y no podría ser más feliz. Esa actitud ligera, eso sí, no es fácil de entender para todo el mundo. En un entorno lleno de ansiedad, confusión y duelo, Hiroto y quienes lo rodean hacen lo que pueden para descifrar esto de vivir. Después de trabar una amistad improbable con la anciana gruñona del barrio, Hiroto se encuentra de pronto heredando no solo su casa, sino también unas cuantas emociones difíciles. Su prima Natsumi, de 18 años, se muda con él, pero como estudiante de arte en apuros arrastra sus propios problemas y puede poner a prueba la vida tranquila de Hiroto. (Fuente: VIZ Media)","186741":"Matthew es un parásito más en la caótica ciudad-mazmorra de Gray Neighbor. Dicen que es un vago sin fuerza que se gasta en juego y alcohol todo el dinero que le da Arwin, la princesa caballero que lo mantiene. La verdad es que nadie en la ciudad sabe cómo es en realidad: un protector despiadado que trabaja en las sombras y que hará lo que haga falta por su señora. (Fuente: Yen Press)","194213":"Todo el mundo lleva un «fantasma» en el corazón: un sentimiento auténtico que está ahí pero no se puede expresar. En esta obra, una chica llamada Nike se enfrenta al absurdo del mundo para proteger el cielo estrellado. Una propuesta exigente que retrata su soledad y su heroísmo, y los matices del corazón en su trato con los demás. (Fuente: nota de prensa de Bandai Namco Filmworks vía Anime News Network)","213360":"«Lo que estás a punto de presenciar es nada menos que la historia viva del rakugo». Inspirada por su padre, rakugoka de profesión, Akane Ousaki aspira a llegar a shin'uchi. Al terminar el instituto entra formalmente en la escuela de Shiguma y, ya como Akane Arakawa, da sus primeros pasos como narradora. Llega al Yasaka-tei, un teatro de rakugo tradicional y bullicioso, donde por fin empieza su formación rodeada de shin'uchi, en el corazón mismo de este arte. Una historia de rakugo en toda regla, donde compiten los grandes narradores. ¡Empieza el arco zenza! (Fuente: Akane-banashi Global, editado)","183960":"Yukito Kirihara, de 16 años, vive con su hermana Sana, de 14, a quien quiere más que a nada. Cuando un ogro aparece al otro lado de su ventana buscando a Sana, algo ya de por sí impactante, Yukito se lanza a salvarla y muere en el intento. Una mujer misteriosa le ofrece reencarnarse y le entrega una hoja de personaje dentro de un libro extraño. Pero al ver que Sana también está ahí, sale a buscarla para salvarlos a los dos, aunque solo cuente con un punto de vida para conseguirlo. (Fuente: Kodansha USA)","208766":"A Aia le decían que había nacido para ser modelo; a Jun la acosaban por sus pecas. Juntas recuperarán el poder de definirse a sí mismas en un manga de moda inspirador que hace preguntas incómodas sobre qué significa de verdad ser bella, y sobre lo que cuesta superar un sistema arbitrario que parece premiar el talento por encima del trabajo. (Fuente: Kodansha USA)","205130":"Después de sacudir al mundo con Parasyte, Hitoshi Iwaaki regresa con una serie que llevaba queriendo abordar desde antes incluso de debutar profesionalmente. Épica histórica ambientada en la Antigüedad, Historie cuenta la vida de Eumenes, un joven de ingenio rápido y un destino enorme por cumplir: con el tiempo llegará a ser un célebre comandante y secretario personal de Alejandro Magno, aunque el camino hasta esa gloria está lleno de peligros. (Fuente: K Manga)","206298":"Secuela de la segunda temporada de Medalist.","197619":"Hana Ichise pertenece a una rama secundaria de uno de los cinco clanes mágicos que tejen barreras para proteger y sostener Japón. A ojos de sus padres, sin embargo, siempre ha sido poca cosa comparada con su talentosa hermana melliza mayor. Cuando su verdadero potencial despierta a los quince años, Hana decide mantener en secreto sus nuevas habilidades, incluso ante sus padres, para poder llevar una vida tranquila. Pero el nuevo y poderoso cabeza del clan Ichinomiya, Saku Ichinomiya, anda buscando esposa… y se ha fijado en ella. (Fuente: Yen Press)","207251":"En este spin-off de la exitosa serie, Iruma es un niño pobrísimo y bondadoso que crece en los suburbios despiadados de una ciudad. Un día le da su último pedazo de pan a un anciano malherido y lo cuida hasta que se recupera, solo para descubrir que el viejo no es otro que Don Sullivan, líder de la mafia Babel. Poco después, Don Sullivan vuelve, se lo lleva consigo y le suplica que sea su nieto. Y así se levanta el telón de la caótica nueva vida de Iruma como heredero de una gigantesca banda de mafiosos, por así decirlo, demoníacos. (Fuente: Kodansha USA)","200578":"La inspectora de policía Isshiki, seria y estricta, se ha ganado el respeto de todo el mundo, pero últimamente no es la de siempre en el trabajo. Cada vez que aparece su compañero Rokutanda se pone nerviosa y mete la pata. Como no tiene ninguna experiencia con sentimientos tan complicados, Isshiki decide montar con él una relación de mentira para averiguar de una vez qué es esto del amor. (Fuente: Yen Press)","210073":"Secuela de la quinta y última temporada de Golden Kamuy.","189121":"Serie secuela de BanG Dream! It's MyGO!!!!! y BanG Dream! Ave Mujica.","219548":"Fuuta Okeya, un estudiante de 14 años, ve fantasmas y lleva una venda en la mejilla izquierda para tapar una marca de nacimiento muy llamativa. Un día llega a su clase una chica con una cicatriz en la frente, Kouko Ishigami, acompañada del fantasma de un hombre alto y afable. Fuuta se encariña enseguida con ella y se pregunta si será amor a primera vista. Después de despertar llorando de un sueño extraño en el que aparece Kouko, siente una conexión nostálgica con ella y se propone hacerse su amigo. Sin embargo, una cadena de hechos lo obliga a enseñarle su marca de nacimiento, y Kouko lo declara el enemigo de su vida. Furiosa, le explica que ambos están unidos por la reencarnación y que esa marca es una maldición que ella misma le grabó en una vida anterior para reconocerlo y acabar derrotándolo. Kouko saca entonces un objeto circular hecho de llamas, el «círculo espiritual», y lo ataca, empujándolo escaleras abajo. Mientras cae, Fuuta es arrojado a la visión de una de sus vidas pasadas. Spirit Circle sigue su ir y venir por esas vidas mientras desentraña poco a poco el origen de su enemistad con Kouko.","210199":"Segunda temporada de The Fable.","213877":"Puede que los asesinos en serie no tengan muchas salidas profesionales, pero Kuroko Koumori parece haber encontrado el trabajo de sus sueños: sicaria al servicio de la policía de Tokio. ¿Licencia para matar a otros asesinos? Eso sí que es satisfacción laboral. (Fuente: Yen Press)","209661":"Wim Strauss es un lanzador de conjuros de apoyo capaz de aumentar la fuerza de sus aliados con su magia. Es un talento útil, pero como no sirve directamente en combate, el resto de su grupo no se lo valora lo más mínimo: para ellos la magia de apoyo es un lastre. No tardan en echarlo, y Wim se pregunta si su carrera de aventurero ha terminado. Por suerte le queda una gran oportunidad: su amiga de la infancia Heidemarie le consigue una prueba con Nachtlibelle, su grupo de élite de rango A. Los dos saben que su magia vale para mucho más que para hacer de comparsa, pero ahora tendrá que demostrarlo. Es hora de enseñarle al mundo que los magos de apoyo no están solo para hacer bulto en la retaguardia. (Fuente: Seven Seas Entertainment)","213052":"«Pase lo que pase, yo te protegeré». Teru Kurebayashi, estudiante de instituto, empieza a recibir mensajes en el móvil que le dejó su difunto hermano Souichirou, su único familiar. Esos mensajes, enviados por una figura misteriosa que firma como «Daisy», se convierten en su único apoyo tras la muerte de su hermano. Un día, después de romper sin querer una ventana del colegio, Teru acaba trabajando para Tasuku Kurosaki, el conserje. Kurosaki tiene la lengua afilada y la hace deslomarse, pero por alguna razón cuida de ella. Y a partir de ese encuentro, el destino de Teru empieza a cambiar drásticamente. (Fuente: web oficial de Dengeki Daisy)","202503":"Minoru Kido, 30 años, causa de la muerte: accidente de tráfico. Como japonés, morí sin dejar ninguna prueba de mi paso por el mundo. Mientras moría pensaba: «La próxima vez quiero vivir mucho y dejar algo que demuestre que estuve aquí». Y entonces reencarné como elfo, con mil años de vida por delante. Por eso hice un juramento: esta vez viviría de una forma que dejara huella. A los veinte años ya dominaba a voluntad toda la magia curativa propia de los elfos. A los treinta había aprendido la magia de todos los elementos, y a los cien había descifrado todas las fórmulas mágicas antiguas. Para los novecientos años que me quedan solo tengo que salir del bosque élfico y convertirme en guerrero. Un día me echará de menos un aventurero novato al que acabarán llamando héroe. A veces se funda un país en mi nombre. A veces me llaman el padre de la magia y me convierten en objeto de culto. Esta es la historia de un elfo reencarnado que graba su nombre en la historia como leyenda viva. (Fuente: Kakuyomu, traducido). Nota: se estrena con una semana de adelanto sobre la emisión en televisión en ABEMA y d anime store desde el 31 de diciembre de 2026. La emisión regular comienza el 7 de enero de 2027.","174427":"En un instante, la vida cotidiana de Takemura, un oficinista que detesta a la gente, cambió por completo. Cuando quiso darse cuenta, estaba en un mundo lleno de zombis. Pero, por alguna razón, es el único al que los zombis no atacan. «¿Ayudar a la gente? ¿Y por qué iba a hacerlo? Pienso vivir en este mundo como me dé la gana». En un mundo postapocalíptico donde la civilización está a punto de derrumbarse, Takemura ha ganado sin querer un gran poder. Siendo el único al que los zombis no tocan, ¿será un héroe o simplemente uno más? (Fuente: Frontier Works, traducido)","207782":"Tras morir de una enfermedad, ha reencarnado como Celine, la duquesa villana, egoísta y gorda, hermana de la protagonista de una novela popular. Si sigue así, el príncipe héroe la matará y tendrá un final miserable, igual que en el libro. Jura enmendarse con todas sus fuerzas y empieza a esforzarse, pero se ve envuelta en unos mimos y una obsesión que no esperaba. ¿Logrará Celine encontrar una felicidad tranquila? Una historia de amor y fantasía sobre una reencarnación en otro mundo donde la quieren demasiado, y de forma muy yandere. (Fuente: Pocket Comics)","213497":"Después de que el héroe derrotara al rey demonio, el mundo por fin está en paz… y eso deja en apuros al joven Aldeano de Villa Principiante. Sin un rey demonio al que vencer, nadie necesita pociones ni objetos, así que El Nido, su tienda, está vacía y sin vida. A este paso tendrá que cerrar. Hasta que aparece una chica misteriosa y todo cambia. (Fuente: K MANGA)","202282":"Segunda temporada de Disney Twisted-Wonderland: THE ANIMATION.","187303":"Oriko Fujido, heredera del zaibatsu Fujido, la mayor empresa de bebidas y máquinas expendedoras del mundo, recibió una ciudad como regalo de su cuarto cumpleaños. Desde entonces se ha esforzado por hacerla prosperar con la ayuda de su mayordomo e investigador, el doctor Sebastian. Poco más de diez años después, un kaiju enorme invade la ciudad y la siempre presumida Oriko declara que debe protegerla. Para ayudarla, el doctor Sebastian crea una bebida energética experimental. Al tomarla, Oriko crece casi al instante hasta el tamaño de un rascacielos. Sin embargo, en su afán por defender la ciudad y plantar cara al kaiju, también provoca un caos considerable. (Fuente: HIDIVE)","194030":"Por alguna razón, lo invitaron a otro mundo después de tirar del gacha como hace siempre. El gacha de su juego de móvil sigue disponible en su fiel teléfono: una herramienta cómoda y tramposa que reparte equipo y personajes femeninos. Ahora se propone montar en ese otro mundo el ejército de chicas más fuerte que exista.","197095":"Reencarnada como vampira, hija de un noble y de la concubina a la que todos desprecian, Mercedes Grunewald siempre ha sabido que un día su padre elegirá a un heredero que no será ella. ¿Y qué será entonces de su familia? Su madre no tiene oficio, la criada es mayor y Mercedes es apenas una niña. ¿Cómo van a sobrevivir solas? Por suerte, explorar mazmorras es un trabajo que puede hacer cualquiera, incluso una cría. Para mantener a los suyos, Mercedes empieza a entrenar con edad de ir a infantil y, como viene de un país de vampiros, tiene potencial de sobra para hacerse fuerte. En su vida anterior murió sin cumplir nada; esta vez no piensa repetirlo. En las mazmorras está decidida a encontrar algo que llene del todo su luna. (Fuente: J-Novel Club)","198728":"Durante el Bakumatsu, en Kioto, un soldado que ha perdido la memoria recibe la ayuda de Soji Okita, oficial adjunto del Mibu Roshigumi. «Te llamas Jinsuke Tachikawa». Y así empieza de nuevo la vida de Jinsuke entre los hombres de Mibu. Este anime original retrata la juventud fugaz de unos jóvenes que vivieron tiempos convulsos, con un trazo afilado y una mirada fresca. (Fuente: Aniplex Online Fest 2025)","199590":"Matsurika, funcionaria del palacio interior, tenía una pequeña habilidad especial: una memoria mejor que la de los demás. Un día aceptó hacer de pareja de prácticas en la entrevista matrimonial del hijo de una familia distinguida. Pero quien apareció fue el propio emperador, Hakuyou, que quería probar a tener una cita concertada. E, interesado por el don de Matsurika, llegó a decirle: «De momento, ve y aprueba el examen imperial». Una historia de Cenicienta al estilo chino entre un emperador y una joven. (Fuente: Kadokawa, traducido)","206798":"Eugene Dawson, un muchacho decidido a hacerse más fuerte, entrena bajo la tutela de su maestra, Liza Pulsandra, aclamada como Santa de la Espada. Sus días junto a ella son felices: es la más fuerte en lo físico, aunque su vida privada sea un pequeño desastre. O eso parecería, porque su cuerpo indefenso y sugerente y su contacto físico involuntario hacen que entrenar resulte casi imposible. ¿De verdad va a conseguir hacerse más fuerte así? (Fuente: KADOKAWA, traducido)","209221":"Bard Cornelius es hijo de un noble de Mauricia, un imperio de un universo paralelo. Pero Bard no es un niño cualquiera: tiene tres almas metidas en un mismo cuerpo. Además de su propia conciencia, carga con Sanai Oka, un samurái tacaño, y con Masaharu Oka, un otaku de instituto obsesionado con las orejas de animales. Con ese conocimiento extra de táctica militar y olfato para los negocios, Bard está listo para abrirse paso hasta la cima haciendo trampas. (Fuente: One Peace Books)","199337":"Segunda temporada de Shin Samurai-den YAIBA.","205430":"Douglas, antes conocido como un legendario mago de refuerzo, hoy no es más que un viejo corriente y sin fuerza. Para colmo, lo echaron del grupo del héroe y acabaron retirándole la licencia de aventurero, así que terminó vagando sin rumbo. Tras encontrarse con Rabi, una niña maldita, empieza una nueva aventura. (Fuente: MANGA UP!)","188546":"Después de dejarle una cicatriz en la cara a su mejor amigo hace años, Tsubaki se siente responsable y está decidido a crecer fuerte para poder proteger a Yuu. Yuu ya está en el instituto y Tsubaki solo en primaria, pero está convencido de que sus sentimientos llegarán y de que algún día Yuu se apoyará en él.","214049":"A Kiritani, subjefe del clan yakuza Kurotorikai, le encargan cuidar de Riyo Washizu, la hija del gran jefe de la organización Washizugumi. Al principio cree que será fácil, porque Riyo parece obediente, pero luego descubre que tiene un fetiche muy concreto, el «yowaraa»: se excita al ver que alguien fuerte y duro se vuelve débil e indefenso. La historia sigue la comedia romántica entre la joven señorita yakuza y su cuidador. (Fuente: MAL News)","211070":"Eiji Kirisame, detective de cuarenta años, se ha topado quizá con la testigo más rara de su carrera: Tsugumi Kuchinashi, una estudiante de instituto muda que estaba en la escena del crimen. Sus declaraciones consisten sobre todo en garabatos torpes en un cuaderno de dibujo, pero Eiji está acostumbrado a reconstruir la verdad con pruebas escasas y se toma en serio cada página si puede ayudar a resolver el caso. ¿Por qué, entonces, la última página dice «¿Te casas conmigo?»? (Fuente: Yen Press)","211258":"Satoshi Oosako era jugador del RPG de realidad virtual «Sword and Sorcery» y murió tras derrotar al Dios Maligno. Al despertar se encontró en un bosque desconocido y, además, con el cuerpo y las habilidades de su avatar. En otras palabras, era un tramposo con todas las de ganar. ¿Podrá un virgen de cuarenta años vivir en paz en este mundo? (Fuente: Shousetsuka ni Narou, traducido)","209224":"Dan-Katsu es un rol legendario con más de 1.021 clases jugables y más de 400 finales posibles: cuanto más lo exploras, más formas de disfrutarlo y más objetos descubres. Cierto jugador, con el nombre de Zephyrus, reencarna en el mundo de Dan-Katsu convertido en su protagonista. Encantado, entra en la Academia del Laberinto, donde transcurre la historia principal. Enseguida consigue la clase Héroe, la mejor del juego, pero descubre que el Guerrero Musculoso, una clase que en su mundo se consideraba un chiste, aquí está bien valorada, y que nadie ha conquistado nunca las mazmorras más difíciles. Es decir: podrá disfrutar de este mundo como si fuera un juego nuevo. Decidido a enseñar a todos lo que es una buena clase, reúne a sus compañeros, convierte a su tímida amiga de la infancia en alquimista y a una princesa egoísta en santa. Con semejantes clases a su alrededor, ya está listo para conquistar las mazmorras. (Fuente: nota de prensa de TO BOOKS)","214461":"«¡No eres la santa de verdad, no eres más que una impostora!». Así, de golpe, me destierran. Y no solo eso: Claude, mi prometido y primer príncipe del reino, anula también nuestro compromiso. Él sostiene que la auténtica santa es Leticia, aunque yo sé desde el principio que es la mujer con la que me ha estado engañando. Así que aquí estoy, compartiendo su deseo de romper el compromiso. Pero ¿es de verdad buena idea desterrarme? ¿Desterrarme a mí, la santa auténtica que levantaba las barreras y sostenía este reino desde las sombras? A lo mejor, solo a lo mejor, mañana mismo empiezan a invadir el país dragones y archidemonios. Quién sabe. Ya no es asunto mío. He abandonado mi propio país y he decidido vivir en paz. Mientras tanto, el reino, que ha perdido a su verdadera santa, va camino de la ruina. (Fuente: Shousetsuka ni Narou, traducido)","207328":"Un par de milenios de soledad desgastarían a cualquier joven, salvo a Asley, un hechicero eternamente joven y eternamente necio. Al fin y al cabo tiene al mejor amigo del hombre, o más bien a su familiar, para hacerle compañía. Cuando Pochi, su perro de nivel 100, le exige que tome el aire por primera vez en dos siglos, Asley se propone reintegrarse en sociedad y poner a prueba su magia. ¿Su misión? Quitarse de encima unos cuantos títulos poco honrosos y recuperar su buen nombre, o al menos uno decente. Tr
